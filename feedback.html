<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>留言板</title>
    <!-- 引入Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入Font Awesome -->
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <!-- 引入Supabase客户端库 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Tailwind配置 -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#6C5CE7', // 科幻紫
                        secondary: '#00F0FF', // 霓虹蓝
                        accent: '#FF2D77', // 霓虹红
                        dark: '#0F172A', // 深色背景
                        darker: '#0A0F1C', // 更深色背景
                    },
                    fontFamily: {
                        cyber: ['Orbitron', 'system-ui', 'sans-serif'],
                    },
                    animation: {
                        'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'glow': 'glow 2s ease-in-out infinite alternate',
                        'scan': 'scan 2s linear infinite',
                    },
                    keyframes: {
                        glow: {
                            '0%': { 'box-shadow': '0 0 5px rgba(108, 92, 231, 0.5), 0 0 10px rgba(108, 92, 231, 0.3)' },
                            '100%': { 'box-shadow': '0 0 10px rgba(108, 92, 231, 0.8), 0 0 20px rgba(108, 92, 231, 0.5), 0 0 30px rgba(108, 92, 231, 0.3)' }
                        },
                        scan: {
                            '0%': { 'background-position': '0% 0%' },
                            '100%': { 'background-position': '0% 100%' }
                        }
                    }
                }
            }
        }
    </script>
    
    <!-- 引入科幻风格字体 -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto {
                content-visibility: auto;
            }
            .text-shadow {
                text-shadow: 0 0 8px rgba(108, 92, 231, 0.8);
            }
            .text-shadow-blue {
                text-shadow: 0 0 8px rgba(0, 240, 255, 0.8);
            }
            .text-shadow-red {
                text-shadow: 0 0 8px rgba(255, 45, 119, 0.8);
            }
            .border-glow {
                box-shadow: 0 0 5px rgba(108, 92, 231, 0.7), 0 0 10px rgba(108, 92, 231, 0.4);
            }
            .bg-grid {
                background-image: 
                    linear-gradient(rgba(108, 92, 231, 0.1) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(108, 92, 231, 0.1) 1px, transparent 1px);
                background-size: 20px 20px;
            }
            .card-hover {
                @apply transition-all duration-300 hover:shadow-lg hover:-translate-y-1 hover:border-primary/70;
            }
            .btn-primary {
                @apply bg-primary/20 border border-primary text-primary px-4 py-2 rounded-lg hover:bg-primary/30 transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-primary/50 animate-glow;
            }
            .input-field {
                @apply w-full px-4 py-3 rounded-lg bg-darker border border-primary/50 text-gray-200 focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition-all duration-200;
            }
            .upload-progress {
                height: 4px;
                background: linear-gradient(to bottom, rgba(108, 92, 231, 0.3) 0%, rgba(108, 92, 231, 0.1) 100%);
                overflow: hidden;
                position: relative;
            }
            .upload-progress-bar {
                position: absolute;
                top: 0;
                left: 0;
                height: 100%;
                background: linear-gradient(90deg, rgba(108, 92, 231, 0.8), rgba(0, 240, 255, 0.8));
                transition: width 0.3s ease;
                background-size: 100% 200%;
                animation: scan 2s linear infinite;
            }
            .file-preview {
                max-height: 200px;
                object-fit: contain;
            }
        }
    </style>
</head>
<body class="font-cyber bg-dark text-gray-200 min-h-screen flex flex-col bg-grid">
    <!-- 顶部导航 -->
    <header class="bg-darker/80 backdrop-blur-md border-b border-primary/30 sticky top-0 z-50 transition-all duration-300">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <i class="fa fa-commenting-o text-secondary text-2xl text-shadow-blue"></i>
                <h1 class="text-xl md:text-2xl font-bold text-primary text-shadow">
                    留言板 <span class="text-xs text-secondary/70 ml-2">留言板 v2.4.1</span>
                </h1>
            </div>
            <div class="flex items-center space-x-4">
                <button id="themeToggle" class="p-2 rounded-full hover:bg-primary/10 transition-colors">
                    <i class="fa fa-star-o text-secondary"></i>
                </button>
                <button id="sortToggle" class="flex items-center space-x-1 text-sm text-secondary hover:text-primary transition-colors">
                    <i class="fa fa-sort-amount-asc"></i>
                    <span>排序</span>
                </button>
            </div>
        </div>
    </header>

    <!-- 主内容区 -->
    <main class="flex-grow container mx-auto px-4 py-8">
        <div class="flex flex-col lg:flex-row gap-8">
            <!-- 左侧：留言发布框 -->
            <div class="lg:w-1/3 space-y-6">
                <div class="bg-darker/60 backdrop-blur-sm rounded-xl border border-primary/30 p-6 sticky top-24 card-hover border-glow">
                    <h2 class="text-xl font-bold mb-4 flex items-center text-secondary text-shadow-blue">
                        <i class="fa fa-pencil-square-o mr-2"></i>发送
                    </h2>
                    
                    <form id="messageForm" class="space-y-4">
                        <div>
                            <label for="username" class="block text-sm font-medium text-gray-400 mb-1">名称</label>
                            <input 
                                type="text" 
                                id="username" 
                                class="input-field" 
                                placeholder="输入你的代号..." 
                                required
                            >
                        </div>
                        
                        <div>
                            <label for="messageContent" class="block text-sm font-medium text-gray-400 mb-1">内容</label>
                            <textarea 
                                id="messageContent" 
                                class="input-field h-32 resize-none" 
                                placeholder="输入你的信息..." 
                                required
                            ></textarea>
                            <div class="flex justify-between items-center mt-1">
                                <button type="button" id="emojiBtn" class="text-gray-400 hover:text-secondary transition-colors">
                                    <i class="fa fa-smile-o mr-1"></i> 符号
                                </button>
                                <span id="charCount" class="text-xs text-gray-500">0/200</span>
                            </div>
                        </div>
                        
                        <!-- 文件上传区域 -->
                        <div>
                            <label class="block text-sm font-medium text-gray-400 mb-2">附加文件</label>
                            <div id="dropArea" class="border-2 border-dashed border-primary/30 rounded-lg p-4 text-center hover:border-primary/70 transition-colors cursor-pointer">
                                <input type="file" id="fileInput" class="hidden" accept="image/*,application/pdf,.doc,.docx,.xls,.xlsx,.txt">
                                <div class="space-y-2">
                                    <i class="fa fa-cloud-upload text-2xl text-secondary"></i>
                                    <p class="text-sm">拖放文件到此处或<span class="text-secondary">点击上传</span></p>
                                    <p class="text-xs text-gray-500">支持图片、文档和文本文件 (最大 10MB)</p>
                                </div>
                                
                                <!-- 上传进度条 (默认隐藏) -->
                                <div id="uploadProgressContainer" class="hidden mt-4">
                                    <div class="upload-progress rounded-full">
                                        <div id="uploadProgressBar" class="upload-progress-bar" style="width: 0%"></div>
                                    </div>
                                    <p id="uploadStatus" class="text-xs text-gray-500 mt-1">准备上传...</p>
                                </div>
                                
                                <!-- 文件预览区域 (默认隐藏) -->
                                <div id="filePreviewContainer" class="hidden mt-4 space-y-2">
                                    <div class="flex items-center p-2 bg-dark rounded-lg">
                                        <i id="previewFileIcon" class="fa fa-file-o text-primary mr-3"></i>
                                        <div class="flex-grow">
                                            <p id="previewFileName" class="text-sm truncate"></p>
                                            <p id="previewFileSize" class="text-xs text-gray-500"></p>
                                        </div>
                                        <button type="button" id="removeFileBtn" class="text-gray-400 hover:text-accent transition-colors">
                                            <i class="fa fa-times"></i>
                                        </button>
                                    </div>
                                    <img id="previewImage" class="file-preview w-full rounded-lg hidden" alt="文件预览">
                                </div>
                            </div>
                        </div>
                        
                        <button type="submit" class="btn-primary w-full flex justify-center items-center">
                            <i class="fa fa-paper-plane mr-2"></i> 发送
                        </button>
                    </form>
                </div>
            </div>
            
            <!-- 右侧：留言列表 -->
            <div class="lg:w-2/3 space-y-6">
                <div class="bg-darker/60 backdrop-blur-sm rounded-xl border border-primary/30 p-4 border-glow">
                    <div class="flex flex-col sm:flex-row items-start sm:items-center gap-4">
                        <div class="relative flex-grow w-full">
                            <i class="fa fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-500"></i>
                            <input 
                                type="text" 
                                id="searchInput" 
                                class="input-field pl-10 py-2 w-full" 
                                placeholder="搜索通讯内容..."
                            >
                        </div>
                        <div class="w-full sm:w-auto">
                            <select id="filterSelect" class="input-field py-2 w-full">
                                <option value="all">全部留言</option>
                                <option value="latest">最新接收</option>
                                <option value="popular">热门留言</option>
                            </select>
                        </div>
                    </div>
                </div>
                
                <!-- 留言列表容器 -->
                <div id="messageList" class="space-y-4">
                    <!-- 加载状态 -->
                    <div class="text-center py-16">
                        <div class="inline-block w-12 h-12 border-4 border-primary/30 border-t-primary rounded-full animate-spin mb-4"></div>
                        <p class="text-gray-400">正在接收跨维度通讯...</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- 底部 -->
    <footer class="bg-darker/80 backdrop-blur-md border-t border-primary/30 mt-12 py-6">
        <div class="container mx-auto px-4 text-center text-gray-500 text-sm">
            <p>星际通讯协议 &copy; 2023 | 基于Supabase量子存储技术</p>
            <p class="mt-1 text-xs">信号强度: <span class="text-green-400">98.7%</span> | 延迟: <span class="text-secondary">0.42ms</span> | 存储容量: <span class="text-accent">87%</span></p>
        </div>
    </footer>

    <!-- 表情选择器 (默认隐藏) -->
    <div id="emojiPicker" class="hidden fixed bg-darker border border-primary/50 rounded-lg shadow-lg p-3 z-50">
        <div class="grid grid-cols-7 gap-2" id="emojiGrid">
            <!-- 表情会通过JavaScript动态生成 -->
        </div>
    </div>

    <!-- 成功提示 (默认隐藏) -->
    <div id="successToast" class="hidden fixed top-4 right-4 bg-primary/20 border border-primary text-primary px-4 py-2 rounded-lg shadow-lg z-50 transition-all duration-300 transform translate-x-full">
        <i class="fa fa-check-circle mr-2"></i>
        <span id="toastMessage">操作成功！</span>
    </div>

    <!-- 文件查看器模态框 (默认隐藏) -->
    <div id="fileViewerModal" class="hidden fixed inset-0 bg-darker/90 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-dark border border-primary/30 rounded-xl max-w-3xl w-full max-h-[90vh] overflow-hidden flex flex-col">
            <div class="p-4 border-b border-primary/20 flex justify-between items-center">
                <h3 id="modalFileName" class="text-secondary font-medium"></h3>
                <button id="closeModalBtn" class="text-gray-400 hover:text-accent transition-colors p-2">
                    <i class="fa fa-times"></i>
                </button>
            </div>
            <div class="flex-grow p-4 overflow-auto flex items-center justify-center">
                <img id="modalImage" class="max-w-full max-h-[70vh] object-contain" alt="文件预览">
                <div id="nonImageFileMessage" class="text-center hidden">
                    <i class="fa fa-file-text-o text-5xl text-primary mb-4"></i>
                    <p id="nonImageFileText" class="text-gray-400"></p>
                    <a id="downloadFileLink" href="#" target="_blank" class="btn-primary mt-4 inline-flex items-center">
                        <i class="fa fa-download mr-2"></i> 下载文件
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script>
        // DOM元素
        const messageForm = document.getElementById('messageForm');
        const usernameInput = document.getElementById('username');
        const messageContent = document.getElementById('messageContent');
        const charCount = document.getElementById('charCount');
        const messageList = document.getElementById('messageList');
        const emojiBtn = document.getElementById('emojiBtn');
        const emojiPicker = document.getElementById('emojiPicker');
        const emojiGrid = document.getElementById('emojiGrid');
        const successToast = document.getElementById('successToast');
        const toastMessage = document.getElementById('toastMessage');
        const searchInput = document.getElementById('searchInput');
        const filterSelect = document.getElementById('filterSelect');
        const themeToggle = document.getElementById('themeToggle');
        const sortToggle = document.getElementById('sortToggle');
        
        // 文件上传相关元素
        const dropArea = document.getElementById('dropArea');
        const fileInput = document.getElementById('fileInput');
        const uploadProgressContainer = document.getElementById('uploadProgressContainer');
        const uploadProgressBar = document.getElementById('uploadProgressBar');
        const uploadStatus = document.getElementById('uploadStatus');
        const filePreviewContainer = document.getElementById('filePreviewContainer');
        const previewFileIcon = document.getElementById('previewFileIcon');
        const previewFileName = document.getElementById('previewFileName');
        const previewFileSize = document.getElementById('previewFileSize');
        const previewImage = document.getElementById('previewImage');
        const removeFileBtn = document.getElementById('removeFileBtn');
        
        // 文件查看器模态框元素
        const fileViewerModal = document.getElementById('fileViewerModal');
        const modalFileName = document.getElementById('modalFileName');
        const modalImage = document.getElementById('modalImage');
        const nonImageFileMessage = document.getElementById('nonImageFileMessage');
        const nonImageFileText = document.getElementById('nonImageFileText');
        const downloadFileLink = document.getElementById('downloadFileLink');
        const closeModalBtn = document.getElementById('closeModalBtn');
        
        // 存储当前选中的文件
        let selectedFile = null;
        let uploadedFileData = null;
        
        // 表情列表
        const emojis = ['👽', '🚀', '🌌', '🔭', '⚡', '💫', '✨', '🤖', '🔮', '👾', '🌠', '🌟', '💻', '🔗', '🕹️'];
        
        // 初始化表情选择器
        function initEmojiPicker() {
            emojis.forEach(emoji => {
                const emojiSpan = document.createElement('span');
                emojiSpan.textContent = emoji;
                emojiSpan.className = 'text-xl cursor-pointer hover:bg-primary/10 rounded p-1 transition-colors';
                emojiSpan.addEventListener('click', () => {
                    messageContent.value += emoji;
                    updateCharCount();
                    emojiPicker.classList.add('hidden');
                });
                emojiGrid.appendChild(emojiSpan);
            });
        }
        
        // 更新字符计数
        function updateCharCount() {
            const count = messageContent.value.length;
            charCount.textContent = `${count}/200`;
            if (count > 200) {
                charCount.classList.add('text-accent');
                messageContent.value = messageContent.value.substring(0, 200);
                updateCharCount();
            } else {
                charCount.classList.remove('text-accent');
            }
        }
        
        // 显示提示消息
        function showToast(message) {
            toastMessage.textContent = message;
            successToast.classList.remove('hidden', 'translate-x-full');
            successToast.classList.add('translate-x-0');
            
            setTimeout(() => {
                successToast.classList.remove('translate-x-0');
                successToast.classList.add('translate-x-full');
                setTimeout(() => {
                    successToast.classList.add('hidden');
                }, 300);
            }, 3000);
        }
        
        // 格式化时间
        function formatTime(timestamp) {
            const date = new Date(timestamp);
            return date.toLocaleString('zh-CN', {
                year: 'numeric',
                month: 'short',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }
        
        // 格式化文件大小
        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }
        
        // 获取文件图标
        function getFileIcon(fileType) {
            if (fileType.startsWith('image/')) return 'fa-file-image-o';
            if (fileType === 'application/pdf') return 'fa-file-pdf-o';
            if (fileType.includes('word')) return 'fa-file-word-o';
            if (fileType.includes('excel')) return 'fa-file-excel-o';
            if (fileType === 'text/plain') return 'fa-file-text-o';
            return 'fa-file-o';
        }
        
        // 处理文件选择
        function handleFileSelection(file) {
            // 检查文件大小
            if (file.size > 10 * 1024 * 1024) { // 10MB
                showToast('文件过大，请选择小于10MB的文件');
                return false;
            }
            
            selectedFile = file;
            uploadedFileData = null;
            
            // 更新预览
            previewFileName.textContent = file.name;
            previewFileSize.textContent = formatFileSize(file.size);
            previewFileIcon.className = `fa ${getFileIcon(file.type)} text-primary mr-3`;
            
            // 显示图片预览（如果是图片）
            if (file.type.startsWith('image/')) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    previewImage.src = e.target.result;
                    previewImage.classList.remove('hidden');
                    previewImage.alt = file.name;
                };
                reader.readAsDataURL(file);
            } else {
                previewImage.classList.add('hidden');
            }
            
            // 显示预览区域
            filePreviewContainer.classList.remove('hidden');
            return true;
        }
        
        // 清除选中的文件
        function clearSelectedFile() {
            selectedFile = null;
            uploadedFileData = null;
            fileInput.value = '';
            filePreviewContainer.classList.add('hidden');
            uploadProgressContainer.classList.add('hidden');
            previewImage.src = '';
        }
        
        // 打开文件查看器
        function openFileViewer(fileData) {
            modalFileName.textContent = fileData.name;
            
            if (fileData.type.startsWith('image/')) {
                modalImage.src = fileData.url;
                modalImage.alt = fileData.name;
                modalImage.classList.remove('hidden');
                nonImageFileMessage.classList.add('hidden');
            } else {
                modalImage.classList.add('hidden');
                nonImageFileMessage.classList.remove('hidden');
                nonImageFileText.textContent = `这是一个 ${fileData.type.split('/')[1] || '文件'} 文件`;
                downloadFileLink.href = fileData.url;
                downloadFileLink.download = fileData.name;
            }
            
            fileViewerModal.classList.remove('hidden');
        }
        
        // 渲染单条留言
        function renderMessage(message) {
            const messageCard = document.createElement('div');
            messageCard.className = 'bg-darker/60 backdrop-blur-sm rounded-xl border border-primary/30 p-6 card-hover';
            messageCard.dataset.id = message.id;
            
            // 生成随机头像颜色
            const colors = ['border-primary', 'border-secondary', 'border-accent'];
            const randomColor = colors[Math.floor(Math.random() * colors.length)];
            const firstChar = message.name.charAt(0).toUpperCase();
            
            // 生成文件附件HTML
            let fileAttachmentHtml = '';
            if (message.file) {
                const fileIcon = getFileIcon(message.file.type);
                fileAttachmentHtml = `
                    <div class="mt-4 p-3 bg-dark rounded-lg border border-primary/20 flex items-center">
                        <i class="fa ${fileIcon} text-secondary mr-3 text-xl"></i>
                        <div class="flex-grow">
                            <p class="text-sm">${message.file.name}</p>
                            <p class="text-xs text-gray-500">${formatFileSize(message.file.size)} · ${message.file.type}</p>
                        </div>
                        <button class="view-file-btn text-primary hover:text-secondary transition-colors" 
                                data-id="${message.id}"
                                data-name="${message.file.name}"
                                data-type="${message.file.type}"
                                data-size="${message.file.size}"
                                data-url="${message.file.url}">
                            <i class="fa fa-eye"></i>
                        </button>
                    </div>
                `;
            }
            
            messageCard.innerHTML = `
                <div class="flex items-start">
                    <div class="flex-shrink-0 border-2 ${randomColor} bg-darker rounded-full w-12 h-12 flex items-center justify-center mr-4">
                        <span class="font-bold text-xl">${firstChar}</span>
                    </div>
                    <div class="flex-grow">
                        <div class="flex justify-between items-start">
                            <h3 class="font-semibold text-secondary">${message.name}</h3>
                            <span class="text-xs text-gray-500">${formatTime(message.created_at)}</span>
                        </div>
                        <p class="mt-3 text-gray-300 whitespace-pre-line">${message.content}</p>
                        
                        ${fileAttachmentHtml}
                        
                        <div class="mt-4 flex items-center space-x-6">
                            <button class="like-btn flex items-center text-gray-400 hover:text-accent transition-colors" data-id="${message.id}">
                                <i class="fa fa-heart-o mr-1"></i>
                                <span>${message.likes || 0} 信号强度</span>
                            </button>
                            <button class="reply-btn flex items-center text-gray-400 hover:text-secondary transition-colors" data-id="${message.id}">
                                <i class="fa fa-reply mr-1"></i>
                                <span>回复</span>
                            </button>
                        </div>
                        
                        <!-- 回复区域 -->
                        <div class="mt-4 space-y-3" id="replies-${message.id}">
                            ${message.replies && message.replies.length > 0 
                                ? message.replies.map(reply => `
                                    <div class="bg-dark border border-primary/20 p-3 rounded-lg text-sm">
                                        <div class="font-medium text-secondary">${reply.name}</div>
                                        <div class="mt-1 text-gray-400">${reply.content}</div>
                                    </div>
                                `).join('') 
                                : ''
                            }
                        </div>
                        
                        <!-- 回复表单 (默认隐藏) -->
                        <div class="mt-3 reply-form hidden" id="replyForm-${message.id}">
                            <input type="text" class="input-field py-2 text-sm" placeholder="输入你的回复..." id="replyInput-${message.id}">
                            <div class="mt-2 flex justify-end">
                                <button type="button" class="cancel-reply btn-primary px-3 py-1 text-sm mr-2">取消</button>
                                <button type="button" class="submit-reply btn-primary px-3 py-1 text-sm" data-id="${message.id}">发送回复</button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            
            return messageCard;
        }
        
        // --- Supabase相关接口 ---
        
        // 1. 配置Supabase项目信息（已填入您提供的信息）
        const supabaseUrl = 'https://scjmhhqpvxluolclbxsp.supabase.co';

        // 3. 创建必要的数据库表和存储桶
        async function createTablesAndBucketIfNotExists() {
            if (!supabase) return;
            
            try {
                // 检查并创建存储桶
                const { data: bucketData, error: bucketError } = await supabase
                    .storage
                    .getBucket('message-attachments');
                
                if (bucketError || !bucketData) {
                    // 创建存储桶
                    const { error: createBucketError } = await supabase
                        .storage
                        .createBucket('message-attachments', {
                            public: true,
                            allowedMimeTypes: [
                                'image/jpeg', 'image/png', 'image/gif', 'image/webp',
                                'application/pdf',
                                'application/msword', 'application/vnd.openxmlformats-officedocument.wordprocessingml.document',
                                'application/vnd.ms-excel', 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',
                                'text/plain'
                            ],
                            maxFileSize: 10 * 1024 * 1024 // 10MB
                        });
                    
                    if (createBucketError) throw createBucketError;
                }
                
                // 检查是否存在messages表
                const { data: tableCheck, error: checkError } = await supabase
                    .from('information_schema.tables')
                    .select('table_name')
                    .eq('table_name', 'messages');
                
                if (checkError) throw checkError;
                
                // 如果表不存在则创建
                if (!tableCheck || tableCheck.length === 0) {
                    // 尝试直接创建表
                    const { error: directCreateError } = await supabase.from('messages').insert([
                        { 
                            name: 'system', 
                            content: '初始化', 
                            likes: 0, 
                            replies: [],
                            file: null
                        }
                    ]).select();
                    
                    if (directCreateError) throw directCreateError;
                }
                return true;
            } catch (error) {
                console.error('初始化失败:', error);
                
                // 尝试手动创建表结构
                try {
                    const { error: sqlError } = await supabase.rpc('exec_sql', {
                        sql: `
                        CREATE TABLE IF NOT EXISTS messages (
                            id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
                            name TEXT NOT NULL,
                            content TEXT NOT NULL,
                            likes INTEGER DEFAULT 0,
                            replies JSONB DEFAULT '[]'::JSONB,
                            file JSONB DEFAULT NULL,
                            created_at TIMESTAMPTZ DEFAULT NOW()
                        );
                        
                        CREATE POLICY "允许公开读取" ON messages FOR SELECT USING (true);
                        CREATE POLICY "允许公开写入" ON messages FOR INSERT WITH CHECK (true);
                        CREATE POLICY "允许公开更新" ON messages FOR UPDATE USING (true);
                        
                        ALTER PUBLICATION supabase_realtime ADD TABLE messages;
                        `
                    });
                    
                    if (sqlError) throw sqlError;
                    return true;
                } catch (sqlError) {
                    console.error('手动创建表失败:', sqlError);
                    return false;
                }
            }
        }
        
        // 4. 上传文件到Supabase存储
        async function uploadFileToSupabase(file) {
  if (!supabase || !file) return { data: null, error: '参数错误' };
  try {
    // 生成唯一文件名（避免重复）
    const fileName = `${Date.now()}-${file.name.replace(/\s+/g, '-')}`;
    // 关键：确保存储桶名是 "message-attachments"，路径格式正确
    const { data, error } = await supabase
      .storage
      .from('message-attachments') // 存储桶名必须完全匹配
      .upload(`public/${fileName}`, file, { // 增加public前缀，符合Supabase存储规范
        cacheControl: '3600',
        upsert: false,
        onUploadProgress: (progressEvent) => {
          const percent = Math.round((progressEvent.loaded / progressEvent.total) * 100);
          uploadProgressBar.style.width = `${percent}%`;
          uploadStatus.textContent = `正在上传: ${percent}%`;
        }
      });
                
                if (error) throw error;
                
                // 获取公共URL
                const { data: urlData } = supabase
                    .storage
                    .from('message-attachments')
                    .getPublicUrl(fileName);
                
                return {
                    data: {
                        name: file.name,
                        type: file.type,
                        size: file.size,
                        path: data.path,
                        url: urlData.publicUrl
                    },
                    error: null
                };
            } catch (error) {
                console.error('文件上传失败:', error);
                return { data: null, error };
            }
        }
        
        // 5. 保存留言到Supabase
        async function saveMessageToSupabase(name, content, fileData = null) {
            if (!supabase) return { error: 'Supabase未初始化' };
            
            try {
                const { data, error } = await supabase
                    .from('messages')
                    .insert([
                        { 
                            name: name, 
                            content: content,
                            likes: 0,
                            replies: [],
                            file: fileData
                        }
                    ])
                    .select();
                
                if (error) throw error;
                return { data, error: null };
            } catch (error) {
                console.error('保存留言失败:', error);
                return { data: null, error };
            }
        }
        
        // 6. 从Supabase加载留言
        async function loadMessagesFromSupabase(order = 'created_at', ascending = false) {
            if (!supabase) return { data: null, error: 'Supabase未初始化' };
            
            try {
                let query = supabase
                    .from('messages')
                    .select('*');
                
                // 设置排序方式
                query = query.order(order, { ascending });
                
                const { data, error } = await query;
                
                if (error) throw error;
                return { data, error: null };
            } catch (error) {
                console.error('加载留言失败:', error);
                return { data: null, error };
            }
        }
        
        // 7. 点赞功能
        async function likeMessageInSupabase(messageId) {
            if (!supabase) return { error: 'Supabase未初始化' };
            
            try {
                // 先获取当前点赞数
                const { data: messageData, error: fetchError } = await supabase
                    .from('messages')
                    .select('likes')
                    .eq('id', messageId)
                    .single();
                
                if (fetchError) throw fetchError;
                
                // 更新点赞数
                const newLikes = (messageData.likes || 0) + 1;
                const { data, error } = await supabase
                    .from('messages')
                    .update({ likes: newLikes })
                    .eq('id', messageId)
                    .select();
                
                if (error) throw error;
                return { data, error: null };
            } catch (error) {
                console.error('点赞失败:', error);
                return { data: null, error };
            }
        }
        
        // 8. 回复功能
        async function replyToMessageInSupabase(messageId, replyName, replyContent) {
            if (!supabase) return { error: 'Supabase未初始化' };
            
            try {
                // 先获取当前回复列表
                const { data: messageData, error: fetchError } = await supabase
                    .from('messages')
                    .select('replies')
                    .eq('id', messageId)
                    .single();
                
                if (fetchError) throw fetchError;
                
                // 添加新回复
                const replies = messageData.replies || [];
                replies.push({
                    name: replyName,
                    content: replyContent,
                    created_at: new Date().toISOString()
                });
                
                // 更新回复列表
                const { data, error } = await supabase
                    .from('messages')
                    .update({ replies: replies })
                    .eq('id', messageId)
                    .select();
                
                if (error) throw error;
                return { data, error: null };
            } catch (error) {
                console.error('回复失败:', error);
                return { data: null, error };
            }
        }
        
        // 9. 设置实时监听，当数据变化时自动更新
        function setupRealtimeUpdates() {
            if (!supabase) return;
            
            // 监听留言表的变化
            const messagesSubscription = supabase
                .channel('custom-filter-channel')
                .on(
                    'postgres_changes',
                    { event: '*', schema: 'public', table: 'messages' },
                    (payload) => {
                        console.log('检测到数据变化，更新通讯列表', payload);
                        loadAndRenderMessages();
                    }
                )
                .subscribe();
                
            return messagesSubscription;
        }
