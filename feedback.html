<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星际留言板 - 跨维度通讯</title>
    <!-- 引入Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入Font Awesome -->
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <!-- 引入Supabase客户端库 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Tailwind配置 -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#6C5CE7', // 科幻紫
                        secondary: '#00F0FF', // 霓虹蓝
                        accent: '#FF2D77', // 霓虹红
                        dark: '#0F172A', // 深色背景
                        darker: '#0A0F1C', // 更深色背景
                    },
                    fontFamily: {
                        cyber: ['Orbitron', 'system-ui', 'sans-serif'],
                    },
                    animation: {
                        'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'glow': 'glow 2s ease-in-out infinite alternate',
                    },
                    keyframes: {
                        glow: {
                            '0%': { 'box-shadow': '0 0 5px rgba(108, 92, 231, 0.5), 0 0 10px rgba(108, 92, 231, 0.3)' },
                            '100%': { 'box-shadow': '0 0 10px rgba(108, 92, 231, 0.8), 0 0 20px rgba(108, 92, 231, 0.5), 0 0 30px rgba(108, 92, 231, 0.3)' }
                        }
                    }
                }
            }
        }
    </script>
    
    <!-- 引入科幻风格字体 -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto {
                content-visibility: auto;
            }
            .text-shadow {
                text-shadow: 0 0 8px rgba(108, 92, 231, 0.8);
            }
            .text-shadow-blue {
                text-shadow: 0 0 8px rgba(0, 240, 255, 0.8);
            }
            .text-shadow-red {
                text-shadow: 0 0 8px rgba(255, 45, 119, 0.8);
            }
            .border-glow {
                box-shadow: 0 0 5px rgba(108, 92, 231, 0.7), 0 0 10px rgba(108, 92, 231, 0.4);
            }
            .bg-grid {
                background-image: 
                    linear-gradient(rgba(108, 92, 231, 0.1) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(108, 92, 231, 0.1) 1px, transparent 1px);
                background-size: 20px 20px;
            }
            .card-hover {
                @apply transition-all duration-300 hover:shadow-lg hover:-translate-y-1 hover:border-primary/70;
            }
            .btn-primary {
                @apply bg-primary/20 border border-primary text-primary px-4 py-2 rounded-lg hover:bg-primary/30 transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-primary/50 animate-glow;
            }
            .input-field {
                @apply w-full px-4 py-3 rounded-lg bg-darker border border-primary/50 text-gray-200 focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition-all duration-200;
            }
        }
    </style>
</head>
<body class="font-cyber bg-dark text-gray-200 min-h-screen flex flex-col bg-grid">
    <!-- 顶部导航 -->
    <header class="bg-darker/80 backdrop-blur-md border-b border-primary/30 sticky top-0 z-50 transition-all duration-300">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <i class="fa fa-commenting-o text-secondary text-2xl text-shadow-blue"></i>
                <h1 class="text-xl md:text-2xl font-bold text-primary text-shadow">
                    留言板 <span class="text-xs text-secondary/70 ml-2">留言板 v2.4.1</span>
                </h1>
            </div>
            <div class="flex items-center space-x-4">
                <button id="themeToggle" class="p-2 rounded-full hover:bg-primary/10 transition-colors">
                    <i class="fa fa-star-o text-secondary"></i>
                </button>
                <button id="sortToggle" class="flex items-center space-x-1 text-sm text-secondary hover:text-primary transition-colors">
                    <i class="fa fa-sort-amount-asc"></i>
                    <span>排序</span>
                </button>
            </div>
        </div>
    </header>

    <!-- 主内容区 -->
    <main class="flex-grow container mx-auto px-4 py-8">
        <div class="flex flex-col lg:flex-row gap-8">
            <!-- 左侧：留言发布框 -->
            <div class="lg:w-1/3 space-y-6">
                <div class="bg-darker/60 backdrop-blur-sm rounded-xl border border-primary/30 p-6 sticky top-24 card-hover border-glow">
                    <h2 class="text-xl font-bold mb-4 flex items-center text-secondary text-shadow-blue">
                        <i class="fa fa-pencil-square-o mr-2"></i>发送
                    </h2>
                    
                    <form id="messageForm" class="space-y-4">
                        <div>
                            <label for="username" class="block text-sm font-medium text-gray-400 mb-1">名称</label>
                            <input 
                                type="text" 
                                id="username" 
                                class="input-field" 
                                placeholder="输入你的代号..." 
                                required
                            >
                        </div>
                        
                        <div>
                            <label for="messageContent" class="block text-sm font-medium text-gray-400 mb-1">内容</label>
                            <textarea 
                                id="messageContent" 
                                class="input-field h-32 resize-none" 
                                placeholder="输入你的信息..." 
                                required
                            ></textarea>
                            <div class="flex justify-between items-center mt-1">
                                <button type="button" id="emojiBtn" class="text-gray-400 hover:text-secondary transition-colors">
                                    <i class="fa fa-smile-o mr-1"></i> 符号
                                </button>
                                <span id="charCount" class="text-xs text-gray-500">0/200</span>
                            </div>
                        </div>
                        
                        <button type="submit" class="btn-primary w-full flex justify-center items-center">
                            <i class="fa fa-paper-plane mr-2"></i> 发送
                        </button>
                    </form>
                </div>
            </div>
            
            <!-- 右侧：留言列表 -->
            <div class="lg:w-2/3 space-y-6">
                <div class="bg-darker/60 backdrop-blur-sm rounded-xl border border-primary/30 p-4 border-glow">
                    <div class="flex flex-col sm:flex-row items-start sm:items-center gap-4">
                        <div class="relative flex-grow w-full">
                            <i class="fa fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-500"></i>
                            <input 
                                type="text" 
                                id="searchInput" 
                                class="input-field pl-10 py-2 w-full" 
                                placeholder="搜索通讯内容..."
                            >
                        </div>
                        <div class="w-full sm:w-auto">
                            <select id="filterSelect" class="input-field py-2 w-full">
                                <option value="all">全部留言</option>
                                <option value="latest">最新接收</option>
                                <option value="popular">热门留言</option>
                            </select>
                        </div>
                    </div>
                </div>
                
                <!-- 留言列表容器 -->
                <div id="messageList" class="space-y-4">
                    <!-- 加载状态 -->
                    <div class="text-center py-16">
                        <div class="inline-block w-12 h-12 border-4 border-primary/30 border-t-primary rounded-full animate-spin mb-4"></div>
                        <p class="text-gray-400">正在接收跨维度通讯...</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- 底部 -->
    <footer class="bg-darker/80 backdrop-blur-md border-t border-primary/30 mt-12 py-6">
        <div class="container mx-auto px-4 text-center text-gray-500 text-sm">
            <p>星际通讯协议 &copy; 2023 | 基于Supabase量子存储技术</p>
            <p class="mt-1 text-xs">信号强度: <span class="text-green-400">98.7%</span> | 延迟: <span class="text-secondary">0.42ms</span></p>
        </div>
    </footer>

    <!-- 表情选择器 (默认隐藏) -->
    <div id="emojiPicker" class="hidden fixed bg-darker border border-primary/50 rounded-lg shadow-lg p-3 z-50">
        <div class="grid grid-cols-7 gap-2" id="emojiGrid">
            <!-- 表情会通过JavaScript动态生成 -->
        </div>
    </div>

    <!-- 成功提示 (默认隐藏) -->
    <div id="successToast" class="hidden fixed top-4 right-4 bg-primary/20 border border-primary text-primary px-4 py-2 rounded-lg shadow-lg z-50 transition-all duration-300 transform translate-x-full">
        <i class="fa fa-check-circle mr-2"></i>
        <span id="toastMessage">操作成功！</span>
    </div>

    <script>
        // DOM元素
        const messageForm = document.getElementById('messageForm');
        const usernameInput = document.getElementById('username');
        const messageContent = document.getElementById('messageContent');
        const charCount = document.getElementById('charCount');
        const messageList = document.getElementById('messageList');
        const emojiBtn = document.getElementById('emojiBtn');
        const emojiPicker = document.getElementById('emojiPicker');
        const emojiGrid = document.getElementById('emojiGrid');
        const successToast = document.getElementById('successToast');
        const toastMessage = document.getElementById('toastMessage');
        const searchInput = document.getElementById('searchInput');
        const filterSelect = document.getElementById('filterSelect');
        const themeToggle = document.getElementById('themeToggle');
        const sortToggle = document.getElementById('sortToggle');

        // 表情列表
        const emojis = ['👽', '🚀', '🌌', '🔭', '⚡', '💫', '✨', '🤖', '🔮', '👾', '🌠', '🌟', '💻', '🔗', '🕹️'];
        
        // 初始化表情选择器
        function initEmojiPicker() {
            emojis.forEach(emoji => {
                const emojiSpan = document.createElement('span');
                emojiSpan.textContent = emoji;
                emojiSpan.className = 'text-xl cursor-pointer hover:bg-primary/10 rounded p-1 transition-colors';
                emojiSpan.addEventListener('click', () => {
                    messageContent.value += emoji;
                    updateCharCount();
                    emojiPicker.classList.add('hidden');
                });
                emojiGrid.appendChild(emojiSpan);
            });
        }
        
        // 更新字符计数
        function updateCharCount() {
            const count = messageContent.value.length;
            charCount.textContent = `${count}/200`;
            if (count > 200) {
                charCount.classList.add('text-accent');
                messageContent.value = messageContent.value.substring(0, 200);
                updateCharCount();
            } else {
                charCount.classList.remove('text-accent');
            }
        }
        
        // 显示提示消息
        function showToast(message) {
            toastMessage.textContent = message;
            successToast.classList.remove('hidden', 'translate-x-full');
            successToast.classList.add('translate-x-0');
            
            setTimeout(() => {
                successToast.classList.remove('translate-x-0');
                successToast.classList.add('translate-x-full');
                setTimeout(() => {
                    successToast.classList.add('hidden');
                }, 300);
            }, 3000);
        }
        
        // 格式化时间
        function formatTime(timestamp) {
            const date = new Date(timestamp);
            return date.toLocaleString('zh-CN', {
                year: 'numeric',
                month: 'short',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }
        
        // 渲染单条留言
        function renderMessage(message) {
            const messageCard = document.createElement('div');
            messageCard.className = 'bg-darker/60 backdrop-blur-sm rounded-xl border border-primary/30 p-6 card-hover';
            messageCard.dataset.id = message.id;
            
            // 生成随机头像颜色
            const colors = ['border-primary', 'border-secondary', 'border-accent'];
            const randomColor = colors[Math.floor(Math.random() * colors.length)];
            const firstChar = message.name.charAt(0).toUpperCase();
            
            messageCard.innerHTML = `
                <div class="flex items-start">
                    <div class="flex-shrink-0 border-2 ${randomColor} bg-darker rounded-full w-12 h-12 flex items-center justify-center mr-4">
                        <span class="font-bold text-xl">${firstChar}</span>
                    </div>
                    <div class="flex-grow">
                        <div class="flex justify-between items-start">
                            <h3 class="font-semibold text-secondary">${message.name}</h3>
                            <span class="text-xs text-gray-500">${formatTime(message.created_at)}</span>
                        </div>
                        <p class="mt-3 text-gray-300 whitespace-pre-line">${message.content}</p>
                        <div class="mt-4 flex items-center space-x-6">
                            <button class="like-btn flex items-center text-gray-400 hover:text-accent transition-colors" data-id="${message.id}">
                                <i class="fa fa-heart-o mr-1"></i>
                                <span>${message.likes || 0} 信号强度</span>
                            </button>
                            <button class="reply-btn flex items-center text-gray-400 hover:text-secondary transition-colors" data-id="${message.id}">
                                <i class="fa fa-reply mr-1"></i>
                                <span>回复</span>
                            </button>
                        </div>
                        
                        <!-- 回复区域 -->
                        <div class="mt-4 space-y-3" id="replies-${message.id}">
                            ${message.replies && message.replies.length > 0 
                                ? message.replies.map(reply => `
                                    <div class="bg-dark border border-primary/20 p-3 rounded-lg text-sm">
                                        <div class="font-medium text-secondary">${reply.name}</div>
                                        <div class="mt-1 text-gray-400">${reply.content}</div>
                                    </div>
                                `).join('') 
                                : ''
                            }
                        </div>
                        
                        <!-- 回复表单 (默认隐藏) -->
                        <div class="mt-3 reply-form hidden" id="replyForm-${message.id}">
                            <input type="text" class="input-field py-2 text-sm" placeholder="输入你的回复..." id="replyInput-${message.id}">
                            <div class="mt-2 flex justify-end">
                                <button type="button" class="cancel-reply btn-primary px-3 py-1 text-sm mr-2">取消</button>
                                <button type="button" class="submit-reply btn-primary px-3 py-1 text-sm" data-id="${message.id}">发送回复</button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            
            return messageCard;
        }
        
        // --- Supabase相关接口 (已填入你的配置) ---
        
        // 1. 你的Supabase配置信息
        const supabaseUrl = 'https://scjmhhqpvxluolclbxsp.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNjam1oaHFwdnhsdW9sY2xieHNwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTk0Njc2ODcsImV4cCI6MjA3NTA0MzY4N30.vmvQyXaUoDuPJWssRtWIdsN5q1pXKqWs2ziYgO0CYtk';
        
        // 2. 初始化Supabase客户端
        let supabase;
        function initSupabase() {
            try {
                supabase = window.supabase.createClient(supabaseUrl, supabaseKey);
                return true;
            } catch (error) {
                console.error('Supabase初始化失败:', error);
                showToast('量子连接失败');
                return false;
            }
        }
        
        // 3. 创建必要的数据库表 (首次运行时自动执行)
        async function createTablesIfNotExists() {
            if (!supabase) return;
            
            try {
                // 检查是否存在messages表
                const { data: tableCheck, error: checkError } = await supabase
                    .from('information_schema.tables')
                    .select('table_name')
                    .eq('table_name', 'messages');
                
                if (checkError) throw checkError;
                
                // 如果表不存在则创建
                if (!tableCheck || tableCheck.length === 0) {
                    const { error: createError } = await supabase.rpc('create_messages_table');
                    
                    if (createError && createError.code !== '42883') {
                        // 尝试直接创建表
                        const { error: directCreateError } = await supabase.from('messages').insert([
                            { name: 'system', content: '初始化', likes: 0, replies: [] }
                        ]).select();
                        
                        if (directCreateError) throw directCreateError;
                    }
                }
                return true;
            } catch (error) {
                console.error('数据库初始化失败:', error);
                
                // 尝试直接创建表结构
                try {
                    const { error: tableError } = await supabase.from('messages').insert([
                        { name: 'system', content: '初始化', likes: 0, replies: [] }
                    ]).select();
                    
                    if (tableError) {
                        // 手动创建表的SQL
                        const { error: sqlError } = await supabase.rpc('exec_sql', {
                            sql: `
                            CREATE TABLE IF NOT EXISTS messages (
                                id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
                                name TEXT NOT NULL,
                                content TEXT NOT NULL,
                                likes INTEGER DEFAULT 0,
                                replies JSONB DEFAULT '[]'::JSONB,
                                created_at TIMESTAMPTZ DEFAULT NOW()
                            );
                            
                            CREATE POLICY "允许公开读取" ON messages FOR SELECT USING (true);
                            CREATE POLICY "允许公开写入" ON messages FOR INSERT WITH CHECK (true);
                            CREATE POLICY "允许公开更新" ON messages FOR UPDATE USING (true);
                            
                            ALTER PUBLICATION supabase_realtime ADD TABLE messages;
                            `
                        });
                        
                        if (sqlError) throw sqlError;
                    }
                    return true;
                } catch (sqlError) {
                    console.error('手动创建表失败:', sqlError);
                    return false;
                }
            }
        }
        
        // 4. 保存留言到Supabase
        async function saveMessageToSupabase(name, content) {
            if (!supabase) return { error: 'Supabase未初始化' };
            
            try {
                const { data, error } = await supabase
                    .from('messages')
                    .insert([
                        { 
                            name: name, 
                            content: content,
                            likes: 0,
                            replies: []
                        }
                    ])
                    .select();
                
                if (error) throw error;
                return { data, error: null };
            } catch (error) {
                console.error('保存留言失败:', error);
                return { data: null, error };
            }
        }
        
        // 5. 从Supabase加载留言
        async function loadMessagesFromSupabase(order = 'created_at', ascending = false) {
            if (!supabase) return { data: null, error: 'Supabase未初始化' };
            
            try {
                let query = supabase
                    .from('messages')
                    .select('*');
                
                // 设置排序方式
                query = query.order(order, { ascending });
                
                const { data, error } = await query;
                
                if (error) throw error;
                return { data, error: null };
            } catch (error) {
                console.error('加载留言失败:', error);
                return { data: null, error };
            }
        }
        
        // 6. 点赞功能
        async function likeMessageInSupabase(messageId) {
            if (!supabase) return { error: 'Supabase未初始化' };
            
            try {
                // 先获取当前点赞数
                const { data: messageData, error: fetchError } = await supabase
                    .from('messages')
                    .select('likes')
                    .eq('id', messageId)
                    .single();
                
                if (fetchError) throw fetchError;
                
                // 更新点赞数
                const newLikes = (messageData.likes || 0) + 1;
                const { data, error } = await supabase
                    .from('messages')
                    .update({ likes: newLikes })
                    .eq('id', messageId)
                    .select();
                
                if (error) throw error;
                return { data, error: null };
            } catch (error) {
                console.error('点赞失败:', error);
                return { data: null, error };
            }
        }
        
        // 7. 回复功能
        async function replyToMessageInSupabase(messageId, replyName, replyContent) {
            if (!supabase) return { error: 'Supabase未初始化' };
            
            try {
                // 先获取当前回复列表
                const { data: messageData, error: fetchError } = await supabase
                    .from('messages')
                    .select('replies')
                    .eq('id', messageId)
                    .single();
                
                if (fetchError) throw fetchError;
                
                // 添加新回复
                const replies = messageData.replies || [];
                replies.push({
                    name: replyName,
                    content: replyContent,
                    created_at: new Date().toISOString()
                });
                
                // 更新回复列表
                const { data, error } = await supabase
                    .from('messages')
                    .update({ replies: replies })
                    .eq('id', messageId)
                    .select();
                
                if (error) throw error;
                return { data, error: null };
            } catch (error) {
                console.error('回复失败:', error);
                return { data: null, error };
            }
        }
        
        // 8. 设置实时监听，当数据变化时自动更新
        function setupRealtimeUpdates() {
            if (!supabase) return;
            
            // 监听留言表的变化
            const messagesSubscription = supabase
                .channel('custom-filter-channel')
                .on(
                    'postgres_changes',
                    { event: '*', schema: 'public', table: 'messages' },
                    (payload) => {
                        console.log('检测到数据变化，更新通讯列表', payload);
                        loadAndRenderMessages();
                    }
                )
                .subscribe();
                
            return messagesSubscription;
        }
        
        // --- 业务逻辑函数 ---
        
        // 加载并渲染留言
        async function loadAndRenderMessages() {
            const filterType = filterSelect.value;
            let order = 'created_at';
            let ascending = false;
            
            if (filterType === 'popular') {
                order = 'likes';
                ascending = false; // 点赞数高的在前
            }
            
            const { data, error } = await loadMessagesFromSupabase(order, ascending);
            
            if (error) {
                messageList.innerHTML = `
                    <div class="text-center py-12 text-gray-500">
                        <i class="fa fa-exclamation-triangle text-accent text-4xl mb-4"></i>
                        <p>通讯接收失败，请重试</p>
                        <button onclick="loadAndRenderMessages()" class="btn-primary mt-3">
                            <i class="fa fa-refresh mr-1"></i> 重新接收
                        </button>
                    </div>
                `;
                return;
            }
            
            if (data && data.length > 0) {
                messageList.innerHTML = '';
                data.forEach(message => {
                    // 跳过系统初始化消息
                    if (message.name === 'system' && message.content === '初始化') return;
                    
                    const messageCard = renderMessage(message);
                    messageList.appendChild(messageCard);
                });
            } else {
                messageList.innerHTML = `
                    <div class="text-center py-12 text-gray-500">
                        <i class="fa fa-comment-o text-4xl mb-4 opacity-30"></i>
                        <p>尚未检测到任何通讯，发送第一条消息吧！</p>
                    </div>
                `;
            }
        }
        
        // --- 事件监听 ---
        
        // 字符计数监听
        messageContent.addEventListener('input', updateCharCount);
        
        // 表情按钮点击
        emojiBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            const rect = emojiBtn.getBoundingClientRect();
            emojiPicker.style.top = `${rect.bottom + window.scrollY + 5}px`;
            emojiPicker.style.left = `${rect.left + window.scrollX}px`;
            emojiPicker.classList.toggle('hidden');
        });
        
        // 点击其他地方关闭表情选择器
        document.addEventListener('click', () => {
            emojiPicker.classList.add('hidden');
        });
        
        // 阻止表情选择器内部点击冒泡
        emojiPicker.addEventListener('click', (e) => {
            e.stopPropagation();
        });
        
        // 表单提交
        messageForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = usernameInput.value.trim() || '匿名旅行者';
            const content = messageContent.value.trim();
            
            if (!content) return;
            
            try {
                // 禁用提交按钮防止重复提交
                const submitBtn = messageForm.querySelector('button[type="submit"]');
                submitBtn.disabled = true;
                submitBtn.innerHTML = '<i class="fa fa-spinner fa-spin mr-2"></i> 发送中...';
                
                // 调用Supabase保存接口
                const { error } = await saveMessageToSupabase(name, content);
                if (error) {
                    showToast('发送失败: ' + error.message);
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<i class="fa fa-paper-plane mr-2"></i> 发送';
                    return;
                }
                
                showToast('通讯发送成功');
                messageContent.value = '';
                updateCharCount();
                
                // 恢复按钮状态
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fa fa-paper-plane mr-2"></i> 发送';
            } catch (error) {
                console.error('发布失败:', error);
                showToast('发送失败，请稍后再试');
                // 恢复按钮状态
                const submitBtn = messageForm.querySelector('button[type="submit"]');
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fa fa-paper-plane mr-2"></i> 发送';
            }
        });
        
        // 点赞和回复按钮点击
        messageList.addEventListener('click', async (e) => {
            // 点赞按钮
            if (e.target.closest('.like-btn')) {
                const likeBtn = e.target.closest('.like-btn');
                const messageId = likeBtn.dataset.id;
                
                // 临时禁用按钮
                likeBtn.disabled = true;
                likeBtn.innerHTML = '<i class="fa fa-spinner fa-spin mr-1"></i> 增强中...';
                
                try {
                    const { error } = await likeMessageInSupabase(messageId);
                    if (error) {
                        showToast('信号增强失败: ' + error.message);
                        likeBtn.disabled = false;
                        likeBtn.innerHTML = '<i class="fa fa-heart-o mr-1"></i><span>信号强度</span>';
                        return;
                    }
                    
                    showToast('信号强度已增强');
                } catch (error) {
                    console.error('点赞失败:', error);
                    showToast('信号增强失败，请稍后再试');
                    likeBtn.disabled = false;
                    likeBtn.innerHTML = '<i class="fa fa-heart-o mr-1"></i><span>信号强度</span>';
                }
            }
            
            // 回复按钮
            if (e.target.closest('.reply-btn')) {
                const replyBtn = e.target.closest('.reply-btn');
                const messageId = replyBtn.dataset.id;
                const replyForm = document.getElementById(`replyForm-${messageId}`);
                
                // 隐藏其他所有回复框
                document.querySelectorAll('.reply-form').forEach(form => {
                    if (form.id !== `replyForm-${messageId}`) {
                        form.classList.add('hidden');
                    }
                });
                
                // 切换当前回复框显示状态
                replyForm.classList.toggle('hidden');
                if (!replyForm.classList.contains('hidden')) {
                    document.getElementById(`replyInput-${messageId}`).focus();
                }
            }
            
            // 取消回复
            if (e.target.closest('.cancel-reply')) {
                const cancelBtn = e.target.closest('.cancel-reply');
                const replyForm = cancelBtn.closest('.reply-form');
                replyForm.classList.add('hidden');
            }
            
            // 提交回复
            if (e.target.closest('.submit-reply')) {
                const submitBtn = e.target.closest('.submit-reply');
                const messageId = submitBtn.dataset.id;
                const replyInput = document.getElementById(`replyInput-${messageId}`);
                const replyContent = replyInput.value.trim();
                
                if (!replyContent) return;
                
                // 禁用按钮
                submitBtn.disabled = true;
                submitBtn.innerHTML = '<i class="fa fa-spinner fa-spin mr-1"></i> 发送中';
                
                try {
                    const { error } = await replyToMessageInSupabase(
                        messageId, 
                        usernameInput.value.trim() || '匿名旅行者', 
                        replyContent
                    );
                    
                    if (error) {
                        showToast('回复发送失败: ' + error.message);
                        submitBtn.disabled = false;
                        submitBtn.innerHTML = '发送回复';
                        return;
                    }
                    
                    replyInput.value = '';
                    document.getElementById(`replyForm-${messageId}`).classList.add('hidden');
                    showToast('回复已发送');
                } catch (error) {
                    console.error('回复失败:', error);
                    showToast('回复发送失败，请稍后再试');
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '发送回复';
                }
            }
        });
        
        // 搜索和筛选
        searchInput.addEventListener('input', filterMessages);
        filterSelect.addEventListener('change', loadAndRenderMessages);
        
        // 排序切换按钮
        sortToggle.addEventListener('click', () => {
            const currentValue = filterSelect.value;
            if (currentValue === 'latest') {
                filterSelect.value = 'popular';
            } else if (currentValue === 'popular') {
                filterSelect.value = 'latest';
            } else {
                filterSelect.value = 'latest';
            }
            loadAndRenderMessages();
        });
        
        // 主题切换 - 切换网格背景密度
        themeToggle.addEventListener('click', () => {
            const body = document.body;
            const icon = themeToggle.querySelector('i');
            
            if (body.classList.contains('bg-grid')) {
                body.classList.remove('bg-grid');
                body.classList.add('bg-[url("data:image/svg+xml,%3Csvg width=\'40\' height=\'40\' viewBox=\'0 0 40 40\' xmlns=\'http://www.w3.org/2000/svg\'%3E%3Cpath d=\'M0 0h20v20H0V0zm10 17a7 7 0 1 0 0-14 7 7 0 0 0 0 14zm20 0a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM10 37a7 7 0 1 0 0-14 7 7 0 0 0 0 14zm10-17h20v20H20V20zm10 17a7 7 0 1 0 0-14 7 7 0 0 0 0 14z\' fill=\'%236c5ce7\' fill-opacity=\'0.05\' fill-rule=\'evenodd\'/%3E%3C/svg%3E")]');
                icon.classList.remove('fa-star-o');
                icon.classList.add('fa-star');
            } else {
                body.classList.add('bg-grid');
                body.classList.remove('bg-[url("data:image/svg+xml,%3Csvg width=\'40\' height=\'40\' viewBox=\'0 0 40 40\' xmlns=\'http://www.w3.org/2000/svg\'%3E%3Cpath d=\'M0 0h20v20H0V0zm10 17a7 7 0 1 0 0-14 7 7 0 0 0 0 14zm20 0a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM10 37a7 7 0 1 0 0-14 7 7 0 0 0 0 14zm10-17h20v20H20V20zm10 17a7 7 0 1 0 0-14 7 7 0 0 0 0 14z\' fill=\'%236c5ce7\' fill-opacity=\'0.05\' fill-rule=\'evenodd\'/%3E%3C/svg%3E")]');
                icon.classList.remove('fa-star');
                icon.classList.add('fa-star-o');
            }
        });
        
        // 筛选留言函数
        function filterMessages() {
            const searchTerm = searchInput.value.toLowerCase();
            const messageCards = document.querySelectorAll('#messageList > div');
            
            messageCards.forEach(card => {
                const content = card.querySelector('p')?.textContent.toLowerCase() || '';
                const name = card.querySelector('h3')?.textContent.toLowerCase() || '';
                
                if (content.includes(searchTerm) || name.includes(searchTerm)) {
                    card.style.display = '';
                    // 添加高亮动画
                    card.classList.add('border-secondary');
                    setTimeout(() => {
                        card.classList.remove('border-secondary');
                    }, 1000);
                } else {
                    card.style.display = 'none';
                }
            });
        }
        
        // 初始化函数
        async function init() {
            initEmojiPicker();
            updateCharCount();
            
            // 初始化Supabase
            const isSupabaseInitialized = initSupabase();
            if (!isSupabaseInitialized) {
                messageList.innerHTML = `
                    <div class="text-center py-12 text-gray-500">
                        <i class="fa fa-exclamation-triangle text-accent text-4xl mb-4"></i>
                        <p>量子连接初始化失败</p>
                        <button onclick="init()" class="btn-primary mt-3">
                            <i class="fa fa-refresh mr-1"></i> 重新连接
                        </button>
                    </div>
                `;
                return;
            }
            
            // 创建必要的表
            const isTablesCreated = await createTablesIfNotExists();
            if (!isTablesCreated) {
                messageList.innerHTML = `
                    <div class="text-center py-12 text-gray-500">
                        <i class="fa fa-database text-accent text-4xl mb-4"></i>
                        <p>数据存储初始化失败</p>
                        <button onclick="init()" class="btn-primary mt-3">
                            <i class="fa fa-refresh mr-1"></i> 重试
                        </button>
                    </div>
                `;
                return;
            }
            
            // 加载留言
            await loadAndRenderMessages();
            
            // 设置实时更新
            setupRealtimeUpdates();
        }
        
        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
