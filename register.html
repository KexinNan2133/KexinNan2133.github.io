<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>用户注册 - 线上交流平台</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }
    
    body {
      background-color: #f5f7fa;
      color: #1d2129;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 1rem;
    }
    
    .hidden {
      display: none !important;
    }
    
    button {
      cursor: pointer;
      transition: all 0.2s ease;
    }
    
    input, select, textarea {
      font-family: inherit;
      transition: all 0.2s ease;
    }
    
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: #165dff;
      box-shadow: 0 0 0 2px rgba(22, 93, 255, 0.1);
    }
    
    .back-link {
      display: inline-flex;
      align-items: center;
      color: #6b7280;
      text-decoration: none;
      margin: 1.5rem 0;
    }
    
    .back-link:hover {
      color: #165dff;
    }
    
    .back-link i {
      margin-right: 0.5rem;
    }
    
    .auth-container {
      display: flex;
      justify-content: center;
      align-items: center;
      flex: 1;
      padding: 2rem 0;
    }
    
    .auth-card {
      width: 100%;
      max-width: 400px;
      background-color: white;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      padding: 2.5rem;
    }
    
    .auth-header {
      margin-bottom: 2rem;
      text-align: center;
    }
    
    .auth-title {
      font-size: 1.75rem;
      font-weight: 700;
      color: #1d2129;
      margin-bottom: 0.5rem;
    }
    
    .auth-subtitle {
      color: #6b7280;
      font-size: 0.9375rem;
    }
    
    .form-group {
      margin-bottom: 1.25rem;
    }
    
    .form-label {
      display: block;
      margin-bottom: 0.5rem;
      font-size: 0.875rem;
      font-weight: 500;
      color: #374151;
    }
    
    .form-control {
      width: 100%;
      padding: 0.875rem 1rem;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 0.9375rem;
      color: #1d2129;
    }
    
    .form-control::placeholder {
      color: #9ca3af;
    }
    
    .form-row {
      display: flex;
      gap: 0.75rem;
    }
    
    .form-row .form-group {
      flex: 1;
      margin-bottom: 1.25rem;
    }
    
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 0.875rem 1.5rem;
      border-radius: 8px;
      font-weight: 500;
      font-size: 0.9375rem;
      border: none;
      text-decoration: none;
    }
    
    .btn-primary {
      background-color: #165dff;
      color: white;
    }
    
    .btn-primary:hover {
      background-color: #0e4cca;
    }
    
    .btn-primary:disabled {
      background-color: #94bfff;
      cursor: not-allowed;
    }
    
    .btn-outline {
      background-color: transparent;
      color: #165dff;
      border: 1px solid #165dff;
    }
    
    .btn-outline:hover {
      background-color: #f0f7ff;
    }
    
    .text-center {
      text-align: center;
    }
    
    .mt-4 {
      margin-top: 1rem;
    }
    
    .mt-6 {
      margin-top: 1.5rem;
    }
    
    .text-sm {
      font-size: 0.875rem;
    }
    
    .text-gray-500 {
      color: #6b7280;
    }
    
    .text-gray-600 {
      color: #4b5563;
    }
    
    .text-blue-500 {
      color: #165dff;
    }
    
    .text-blue-500:hover {
      color: #0e4cca;
      text-decoration: underline;
    }
    
    .text-red-500 {
      color: #f53f3f;
    }
    
    .error-message {
      margin-top: 0.375rem;
      font-size: 0.875rem;
      color: #f53f3f;
      display: flex;
      align-items: center;
    }
    
    .error-message i {
      margin-right: 0.25rem;
      font-size: 0.75rem;
    }
    
    .success-message {
      margin-top: 0.375rem;
      font-size: 0.875rem;
      color: #00b42a;
      display: flex;
      align-items: center;
    }
    
    .success-message i {
      margin-right: 0.25rem;
      font-size: 0.75rem;
    }
    
    .form-hint {
      margin-top: 0.375rem;
      font-size: 0.75rem;
      color: #6b7280;
    }
    
    .separator {
      display: flex;
      align-items: center;
      margin: 1.5rem 0;
    }
    
    .separator::before, .separator::after {
      content: '';
      flex: 1;
      height: 1px;
      background-color: #e5e7eb;
    }
    
    .separator span {
      padding: 0 0.75rem;
      font-size: 0.875rem;
      color: #6b7280;
    }
    
    .policy-text {
      font-size: 0.75rem;
      color: #6b7280;
      margin-top: 1rem;
      text-align: center;
    }
    
    .policy-text a {
      color: #165dff;
    }
    
    .policy-text a:hover {
      text-decoration: underline;
    }
    
    .captcha-container {
      display: flex;
      gap: 0.75rem;
    }
    
    .captcha-input {
      flex: 1;
    }
    
    .captcha-btn {
      width: auto;
      white-space: nowrap;
      padding: 0.875rem 1rem;
    }
    
    .admin-link {
      display: inline-block;
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.875rem;
      color: #6b7280;
    }
    
    .admin-link i {
      margin-right: 0.25rem;
    }
    
    .admin-link:hover {
      color: #165dff;
      text-decoration: none;
    }
    
    .loading-spinner {
      width: 1rem;
      height: 1rem;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 1s ease-in-out infinite;
      margin-right: 0.5rem;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    @media (max-width: 640px) {
      .auth-card {
        padding: 1.5rem;
        margin: 1rem;
      }
      
      .auth-title {
        font-size: 1.5rem;
      }
      
      .form-row {
        flex-direction: column;
        gap: 0;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- 返回登录页 - 跳转链接标识：LOGIN_PAGE_LINK -->
    <a href="index.html" class="back-link">
      <i class="fas fa-arrow-left"></i> 返回登录
    </a>
  </div>
  
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <h1 class="auth-title">创建账号</h1>
        <p class="auth-subtitle">注册后即可使用线上交流平台的全部功能</p>
      </div>
      
      <form id="registerForm" class="space-y-4">
        <div class="form-group">
          <label for="username" class="form-label">用户名</label>
          <input 
            type="text" 
            id="username" 
            class="form-control" 
            placeholder="请设置用户名（2-16个字符）"
            required
          >
          <div id="usernameError" class="error-message hidden"></div>
          <p class="form-hint">支持中文、字母、数字和下划线，不超过16个字符</p>
        </div>
        
        <div class="form-group">
          <label for="phone" class="form-label">手机号码</label>
          <input 
            type="tel" 
            id="phone" 
            class="form-control" 
            placeholder="请输入手机号码"
            required
          >
          <div id="phoneError" class="error-message hidden"></div>
        </div>
        
        <div class="form-row">
          <div class="form-group captcha-input">
            <label for="verifyCode" class="form-label">验证码</label>
            <input 
              type="text" 
              id="verifyCode" 
              class="form-control" 
              placeholder="请输入验证码"
              required
            >
            <div id="codeError" class="error-message hidden"></div>
          </div>
          
          <div class="form-group" style="margin-bottom: 0;">
            <label class="form-label" style="visibility: hidden;">获取验证码</label>
            <button 
              type="button" 
              id="sendCodeBtn" 
              class="btn btn-outline captcha-btn"
            >
              获取验证码
            </button>
          </div>
        </div>
        
        <div class="form-group">
          <label for="password" class="form-label">设置密码</label>
          <input 
            type="password" 
            id="password" 
            class="form-control" 
            placeholder="请设置密码"
            required
          >
          <div id="passwordError" class="error-message hidden"></div>
          <p class="form-hint">密码需包含大小写字母、数字和特殊字符，长度不少于8位</p>
        </div>
        
        <div class="form-group">
          <label for="confirmPassword" class="form-label">确认密码</label>
          <input 
            type="password" 
            id="confirmPassword" 
            class="form-control" 
            placeholder="请再次输入密码"
            required
          >
          <div id="confirmError" class="error-message hidden"></div>
        </div>
        
        <div class="form-group">
          <label class="flex items-center">
            <input 
              type="checkbox" 
              class="form-checkbox h-4 w-4 text-blue-500 border-gray-300 rounded"
              required
            >
            <span class="ml-2 text-sm text-gray-600">
              我已阅读并同意<a href="#" class="text-blue-500 hover:underline">《用户协议》</a>和<a href="#" class="text-blue-500 hover:underline">《隐私政策》</a>
            </span>
          </label>
        </div>
        
        <button 
          type="submit" 
          id="registerBtn" 
          class="btn btn-primary mt-6"
        >
          注册并提交审核
        </button>
        
        <div class="text-center text-sm mt-4">
          已有账号？
          <!-- 登录页面链接 - 跳转链接标识：LOGIN_PAGE_LINK -->
          <a href="index.html" class="text-blue-500 hover:underline">立即登录</a>
        </div>
      </form>
      
      <!-- 管理员登录入口 - 跳转链接标识：ADMIN_LOGIN_LINK -->
      <a href="admin-login.html" class="admin-link">
        <i class="fas fa-shield-alt"></i> 管理员登录入口
      </a>
    </div>
  </div>

  <script>
    // Supabase 配置 - 使用提供的项目信息
    const supabaseUrl = "https://czjcvwsalxftsxomfiyf.supabase.co";
    const supabaseAnonKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN6amN2d3NhbHhmdHN4b21maXlmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTk0NzYwMDMsImV4cCI6MjA3NTA1MjAwM30.KowEk4M6Ykl8q21DxsT9dKOgmwy0Hlg3cabD6tr3Q8k";
    const supabase = supabase.createClient(supabaseUrl, supabaseAnonKey);
    
    // DOM 元素
    const registerForm = document.getElementById('registerForm');
    const usernameInput = document.getElementById('username');
    const phoneInput = document.getElementById('phone');
    const verifyCodeInput = document.getElementById('verifyCode');
    const passwordInput = document.getElementById('password');
    const confirmPasswordInput = document.getElementById('confirmPassword');
    const sendCodeBtn = document.getElementById('sendCodeBtn');
    const registerBtn = document.getElementById('registerBtn');
    
    // 错误提示元素
    const usernameError = document.getElementById('usernameError');
    const phoneError = document.getElementById('phoneError');
    const codeError = document.getElementById('codeError');
    const passwordError = document.getElementById('passwordError');
    const confirmError = document.getElementById('confirmError');
    
    // 显示错误提示
    function showError(element, message) {
      element.innerHTML = `<i class="fas fa-exclamation-circle"></i> ${message}`;
      element.classList.remove('hidden');
    }
    
    // 隐藏错误提示
    function hideError(element) {
      element.classList.add('hidden');
    }
    
    // 验证用户名
    function validateUsername(username) {
      if (!username) {
        showError(usernameError, '请输入用户名');
        return false;
      }
      
      if (username.length < 2 || username.length > 16) {
        showError(usernameError, '用户名长度必须在2-16个字符之间');
        return false;
      }
      
      const regex = /^[\u4e00-\u9fa5a-zA-Z0-9_]+$/;
      if (!regex.test(username)) {
        showError(usernameError, '用户名只能包含中文、字母、数字和下划线');
        return false;
      }
      
      hideError(usernameError);
      return true;
    }
    
    // 验证手机号
    function validatePhone(phone) {
      if (!phone) {
        showError(phoneError, '请输入手机号码');
        return false;
      }
      
      const regex = /^1[3-9]\d{9}$/;
      if (!regex.test(phone)) {
        showError(phoneError, '请输入有效的手机号码');
        return false;
      }
      
      hideError(phoneError);
      return true;
    }
    
    // 验证验证码
    function validateVerifyCode(code) {
      if (!code) {
        showError(codeError, '请输入验证码');
        return false;
      }
      
      if (code.length !== 6) {
        showError(codeError, '验证码必须是6位数字');
        return false;
      }
      
      hideError(codeError);
      return true;
    }
    
    // 验证密码
    function validatePassword(password) {
      if (!password) {
        showError(passwordError, '请设置密码');
        return false;
      }
      
      if (password.length < 8) {
        showError(passwordError, '密码长度不能少于8位');
        return false;
      }
      
      // 密码强度验证：包含大小写字母、数字和特殊字符
      const regex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}$/;
      if (!regex.test(password)) {
        showError(passwordError, '密码需包含大小写字母、数字和特殊字符');
        return false;
      }
      
      hideError(passwordError);
      return true;
    }
    
    // 验证确认密码
    function validateConfirmPassword(password, confirmPassword) {
      if (!confirmPassword) {
        showError(confirmError, '请再次输入密码');
        return false;
      }
      
      if (password !== confirmPassword) {
        showError(confirmError, '两次输入的密码不一致');
        return false;
      }
      
      hideError(confirmError);
      return true;
    }
    
    // 发送验证码
    sendCodeBtn.addEventListener('click', async () => {
      const phone = phoneInput.value.trim();
      
      // 验证手机号
      if (!validatePhone(phone)) {
        return;
      }
      
      // 禁用按钮并显示倒计时
      sendCodeBtn.disabled = true;
      sendCodeBtn.textContent = '发送中...';
      
      try {
        // 检查手机号是否已注册
        const { data: existingUsers } = await supabase
          .from('profiles')
          .select('id')
          .eq('phone', phone)
          .single();
          
        if (existingUsers) {
          showError(phoneError, '该手机号已注册，请直接登录');
          sendCodeBtn.disabled = false;
          sendCodeBtn.textContent = '获取验证码';
          return;
        }
        
        // 生成6位验证码
        const code = Math.floor(100000 + Math.random() * 900000).toString();
        
        // 存储验证码到数据库（有效期5分钟）
        const { error } = await supabase
          .from('verify_codes')
          .insert([{
            target: phone,
            code,
            type: 'user_register',
            expire_at: new Date(Date.now() + 5 * 60 * 1000) // 5分钟有效期
          }]);
          
        if (error) throw error;
        
        // 显示倒计时
        let countdown = 60;
        sendCodeBtn.textContent = `重新发送(${countdown}s)`;
        
        const timer = setInterval(() => {
          countdown--;
          sendCodeBtn.textContent = `重新发送(${countdown}s)`;
          
          if (countdown <= 0) {
            clearInterval(timer);
            sendCodeBtn.disabled = false;
            sendCodeBtn.textContent = '获取验证码';
          }
        }, 1000);
        
        // 提示用户（实际项目中应调用短信API发送验证码）
        alert(`验证码已发送，您的验证码是：${code}（5分钟内有效）`);
        
      } catch (err) {
        console.error('发送验证码错误:', err);
        showError(phoneError, '发送验证码失败，请重试');
        sendCodeBtn.disabled = false;
        sendCodeBtn.textContent = '获取验证码';
      }
    });
    
    // 表单提交
    registerForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      // 获取表单数据
      const username = usernameInput.value.trim();
      const phone = phoneInput.value.trim();
      const code = verifyCodeInput.value.trim();
      const password = passwordInput.value;
      const confirmPassword = confirmPasswordInput.value;
      
      // 表单验证
      const isUsernameValid = validateUsername(username);
      const isPhoneValid = validatePhone(phone);
      const isCodeValid = validateVerifyCode(code);
      const isPasswordValid = validatePassword(password);
      const isConfirmValid = validateConfirmPassword(password, confirmPassword);
      
      if (!isUsernameValid || !isPhoneValid || !isCodeValid || !isPasswordValid || !isConfirmValid) {
        return;
      }
      
      // 禁用注册按钮并显示加载状态
      registerBtn.disabled = true;
      registerBtn.innerHTML = '<div class="loading-spinner"></div> 注册中...';
      
      try {
        // 验证验证码
        const { data: verifyCode, error: codeError } = await supabase
          .from('verify_codes')
          .select('code, expire_at')
          .eq('target', phone)
          .eq('type', 'user_register')
          .single();
          
        if (codeError || !verifyCode) {
          showError(codeErrorEl, '验证码错误或已过期，请重新获取');
          registerBtn.disabled = false;
          registerBtn.textContent = '注册并提交审核';
          return;
        }
        
        // 检查验证码是否过期
        if (new Date(verifyCode.expire_at) < new Date()) {
          showError(codeErrorEl, '验证码已过期，请重新获取');
          registerBtn.disabled = false;
          registerBtn.textContent = '注册并提交审核';
          return;
        }
        
        // 检查验证码是否匹配
        if (verifyCode.code !== code) {
          showError(codeErrorEl, '验证码错误，请重新输入');
          registerBtn.disabled = false;
          registerBtn.textContent = '注册并提交审核';
          return;
        }
        
        // 密码加密（实际项目中应在后端进行加密）
        // 这里仅为示例，生产环境需使用bcrypt等算法在后端加密
        const passwordHash = password; // 实际项目中替换为加密逻辑
        
        // 创建用户（状态为待审核）
        const { data: newUser, error } = await supabase
          .from('profiles')
          .insert([{
            username,
            phone,
            password_hash: passwordHash,
            status: 'pending', // 待审核状态
            created_at: new Date()
          }])
          .select()
          .single();
          
        if (error) throw error;
        
        // 删除已使用的验证码
        await supabase
          .from('verify_codes')
          .delete()
          .eq('target', phone)
          .eq('code', code);
          
        // 注册成功，跳转到审核等待页
        // 审核等待页链接 - 跳转链接标识：VERIFY_PENDING_LINK
        window.location.href = 'verify-pending.html';
        
      } catch (err) {
        console.error('注册错误:', err);
        alert('注册失败，请重试');
        registerBtn.disabled = false;
        registerBtn.textContent = '注册并提交审核';
      }
    });
    
    // 实时验证
    usernameInput.addEventListener('blur', () => {
      validateUsername(usernameInput.value.trim());
    });
    
    phoneInput.addEventListener('blur', () => {
      validatePhone(phoneInput.value.trim());
    });
    
    verifyCodeInput.addEventListener('blur', () => {
      validateVerifyCode(verifyCodeInput.value.trim());
    });
    
    passwordInput.addEventListener('blur', () => {
      validatePassword(passwordInput.value);
    });
    
    confirmPasswordInput.addEventListener('blur', () => {
      validateConfirmPassword(passwordInput.value, confirmPasswordInput.value);
    });
  </script>
</body>
</html>
