<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KexinNan Music</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <img src="https://kexinnan2133.github.io/image/头像.jpg" alt="Kimi Music">
        <h1>KexinNan Music</h1>
    </header>

    <div class="container">
        <h1>Welcome to KexinNan Music</h1>
        <p>This is a place where music meets creativity. Discover new tracks, explore different genres, and catch the latest music trends.</p>
        <p>Feel free to reach out and connect with us. Let's make music together!</p>
        <p>Check out our <a href="https://kexinnan2133.github.io/kimi-Music.html">latest tracks</a> and updates.</p>
    </div>

    <div class="container comments">
        <h3>评论留言</h3>
        <form id="comment-form">
            <label for="name">姓名：</label>
            <input type="text" id="name" name="name" required>
            <label for="comment">评论：</label>
            <textarea id="comment" name="comment" rows="4" required></textarea>
            <button type="submit">提交评论</button>
        </form>
        <div id="comments-list" class="comments-list"></div>
    </div>

    <script src="scripts.js"></script>
</body>
</html>
