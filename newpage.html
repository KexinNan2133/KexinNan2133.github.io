<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>茶产品过度包装计算（仅适用于"k=9"）</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            font-family: Arial, sans-serif;
            margin: 20px;
            padding: 30px;
            box-sizing: border-box;
            max-width: 800px;
            margin: auto;
        }
        h1 {
            font-size: 1.5em;
            text-align: center;
        }
        label {
            font-weight: bold;
        }
        input, button {
            width: 100%;
            padding: 10px;
            font-size: 1em;
            box-sizing: border-box;
        }
        button {
            background-color: #4CAF50;
            color: white;
            border: 1px solid #ccc;
            cursor: pointer;
            width: 40%;
            margin: auto;
            margin-top: 20px;
        }
        button:hover {
            background-color: #45a049;
        }
        .result {
            margin-top: 20px;
            font-size: 1.2em;
        }
        .container1 {
            display: flex;
            flex-direction: column;
            margin-bottom: 20px;

        }
        .container2 {
            border: 2px solid #069d42;
            border-radius: 20px;
            display: flex;
            margin-bottom: 20px;
            margin: auto;
            width: 600px;
            padding-right: 30px;
            padding-top: 30px;
            padding-bottom: 30px;
        }
        .d-h {
            display: flex;
            flex: 1;
            flex-direction: column;
            margin-bottom: 20px;
            margin-right: 20px;
            border: 1px solid #4e514f;
            border-top-right-radius: 20px;
            border-bottom-right-radius: 20px;
        }
        .c-y {
            display: flex;
            flex-direction: column;
            margin-bottom: 20px;
            border: 1px solid #454545;
            margin-top: 21px;
            border-top-right-radius: 20px;
            width: 80%;        
        }
        .c-b {
            display: flex;
            flex-direction: column;
            margin-bottom: 20px;
            border: 1px solid #4e514f; 
            border-top-right-radius: 20px;
            width: 80%;        
        }
        .b-zl {
            display: flex;
            flex: 2;
            flex-direction: column;
            margin-bottom: 20px;
        }
        
        @media (max-width: 600px) {
            body {
            margin: 10px;
            }
            h1 {
            font-size: 1.2em;
            }
            input, button {
            font-size: 0.9em;
            }
            .result {
            font-size: 1em;
            }
        }
    </style>
</head>
<body>
    <div class="container1">
        <h1>茶产品过度包装计算（仅适用于"k=9"）</h1>
    </div>    
   
    <div class="container2">
        <div class="d-h">
            <div class="c-y">
                <a href="https://kexinnan2133.github.io/index.html">
                    茶饼 (K="13")
                </a>
            </div><br>
            <div class="c-b">
                <a href="https://kexinnan2133.github.io/index.html">
                    茶饼 (K="9")
                </a>
            </div>
        </div>
        <div class="b-zl">    
            <label for="length">外包装长度（毫米）:</label>
            <input type="number" id="length" min="0" step="1">
        
            <label for="width">外包装宽度（毫米）:</label>
            <input type="number" id="width" min="0" step="1">
        
            <label for="height">外包装高度（毫米）:</label>
            <input type="number" id="height" min="0" step="1">
        
            <button onclick="calculateVolume()">计算外包装容积</button>
        
            <div class="result" id="volumeResult"></div>
    
            <label for="netWeight">茶叶净含量（克）:</label>
            <input type="number" id="netWeight" min="0" step="0.01">
            
            <label for="packageVolume">商品销售外包装体积（立方毫米）:</label>
            <input type="number" id="packageVolume" min="0" step="1">
            
            <button onclick="calculate()">计算产品包装率</button>
            
            <div class="result" id="result"></div>
        </div>
    </div>

    <script>
        function calculateVolume() {
            const length = parseFloat(document.getElementById('length').value);
            const width = parseFloat(document.getElementById('width').value);
            const height = parseFloat(document.getElementById('height').value);

            if (isNaN(length) || isNaN(width) || isNaN(height) || length <= 0 || width <= 0 || height <= 0) {
                alert('请输入有效的数值');
                return;
            }

            const volume = length * width * height;
            document.getElementById('packageVolume').value = volume;
            document.getElementById('volumeResult').innerHTML = `外包装容积: ${volume.toFixed(2)} 立方毫米`;
        }
        function calculate() {
            const netWeight = parseFloat(document.getElementById('netWeight').value);
            const packageVolume = parseFloat(document.getElementById('packageVolume').value);
            
            if (isNaN(netWeight) || isNaN(packageVolume) || netWeight <= 0 || packageVolume <= 0) {
                alert('请输入有效的数值');
                return;
            }
            
            const voidSpace = packageVolume - 9 * 1000 * netWeight;
            const voidRate = (voidSpace / packageVolume) * 100;
            
            let maxVoidRate;
            if (netWeight <= 1) {
                maxVoidRate = 85;
            } else if (netWeight <= 5) {
                maxVoidRate = 70;
            } else if (netWeight <= 15) {
                maxVoidRate = 60;
            } else if (netWeight <= 30) {
                maxVoidRate = 50;
            } else if (netWeight <= 50) {
                maxVoidRate = 40;
            } else {
                maxVoidRate = 30;
            }
            
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = `空隙空间: ${voidSpace.toFixed(2)} 立方毫米<br>空隙率: ${voidRate.toFixed(2)}%<br>最大允许空隙率: ${maxVoidRate}%<br>`;
            
            if (voidRate <= maxVoidRate) {
                resultDiv.innerHTML += '<span style="color: green;">包装符合要求</span>';
            } else {
                resultDiv.innerHTML += '<span style="color: red;">包装不符合要求</span>';
            }
        }
    </script>
</body>
</html>
