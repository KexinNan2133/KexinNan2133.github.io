<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>审核中 - 线上交流平台</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }
    
    body {
      background-color: #f5f7fa;
      color: #1d2129;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 1rem;
    }
    
    .hidden {
      display: none !important;
    }
    
    .main-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      padding: 2rem 0;
      text-align: center;
    }
    
    .status-icon {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background-color: #fff8e6;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 2rem;
    }
    
    .status-icon i {
      font-size: 4rem;
      color: #ff7d00;
    }
    
    .status-title {
      font-size: 1.75rem;
      font-weight: 700;
      color: #1d2129;
      margin-bottom: 1rem;
    }
    
    .status-message {
      font-size: 1rem;
      color: #6b7280;
      max-width: 500px;
      margin-bottom: 2rem;
      line-height: 1.6;
    }
    
    .action-buttons {
      display: flex;
      gap: 1rem;
      margin-top: 1rem;
    }
    
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.875rem 1.5rem;
      border-radius: 8px;
      font-weight: 500;
      font-size: 0.9375rem;
      border: none;
      text-decoration: none;
    }
    
    .btn-primary {
      background-color: #165dff;
      color: white;
    }
    
    .btn-primary:hover {
      background-color: #0e4cca;
    }
    
    .btn-outline {
      background-color: transparent;
      color: #165dff;
      border: 1px solid #165dff;
    }
    
    .btn-outline:hover {
      background-color: #f0f7ff;
    }
    
    .back-link {
      display: inline-flex;
      align-items: center;
      color: #6b7280;
      text-decoration: none;
      margin: 1.5rem 0;
    }
    
    .back-link:hover {
      color: #165dff;
    }
    
    .back-link i {
      margin-right: 0.5rem;
    }
    
    .timeline {
      max-width: 500px;
      width: 100%;
      margin: 2rem 0;
    }
    
    .timeline-item {
      display: flex;
      margin-bottom: 1.5rem;
      position: relative;
    }
    
    .timeline-item::before {
      content: '';
      position: absolute;
      left: 15px;
      top: 30px;
      bottom: -1.5rem;
      width: 1px;
      background-color: #e5e7eb;
      z-index: 1;
    }
    
    .timeline-item:last-child::before {
      display: none;
    }
    
    .timeline-dot {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background-color: #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 1rem;
      flex-shrink: 0;
      z-index: 2;
    }
    
    .timeline-item.active .timeline-dot {
      background-color: #165dff;
      color: white;
    }
    
    .timeline-content {
      text-align: left;
    }
    
    .timeline-title {
      font-weight: 600;
      margin-bottom: 0.25rem;
    }
    
    .timeline-text {
      font-size: 0.875rem;
      color: #6b7280;
    }
    
    @media (max-width: 640px) {
      .status-title {
        font-size: 1.5rem;
      }
      
      .action-buttons {
        flex-direction: column;
        width: 100%;
        max-width: 300px;
      }
      
      .btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- 返回登录页 - 跳转链接标识：LOGIN_PAGE_LINK -->
    <a href="index.html" class="back-link">
      <i class="fas fa-arrow-left"></i> 返回登录
    </a>
  </div>
  
  <div class="main-content">
    <div class="status-icon">
      <i class="fas fa-clock"></i>
    </div>
    
    <h1 class="status-title">您的账号正在审核中</h1>
    
    <p class="status-message">
      感谢您的注册！我们的管理员将在24小时内审核您的账号。审核通过后，我们会通过短信通知您，
      请您耐心等待。如有紧急问题，请联系客服热线。
    </p>
    
    <div class="timeline">
      <div class="timeline-item active">
        <div class="timeline-dot">
          <i class="fas fa-check"></i>
        </div>
        <div class="timeline-content">
          <div class="timeline-title">提交注册申请</div>
          <div class="timeline-text" id="registerTime">刚刚</div>
        </div>
      </div>
      
      <div class="timeline-item">
        <div class="timeline-dot">
          <i class="fas fa-user-check"></i>
        </div>
        <div class="timeline-content">
          <div class="timeline-title">管理员审核</div>
          <div class="timeline-text">等待中（预计24小时内完成）</div>
        </div>
      </div>
      
      <div class="timeline-item">
        <div class="timeline-dot">
          <i class="fas fa-check-circle"></i>
        </div>
        <div class="timeline-content">
          <div class="timeline-title">审核完成</div>
          <div class="timeline-text">审核通过后可正常登录使用</div>
        </div>
      </div>
    </div>
    
    <div class="action-buttons">
      <!-- 返回登录页 - 跳转链接标识：LOGIN_PAGE_LINK -->
      <a href="index.html" class="btn btn-primary">
        <i class="fas fa-arrow-left mr-2"></i> 返回登录页
      </a>
      
      <!-- 帮助中心链接 - 跳转链接标识：HELP_CENTER_LINK -->
      <a href="#" class="btn btn-outline">
        <i class="fas fa-question-circle mr-2"></i> 帮助中心
      </a>
    </div>
  </div>

  <script>
    // Supabase 配置 - 使用提供的项目信息
    const supabaseUrl = "https://czjcvwsalxftsxomfiyf.supabase.co";
    const supabaseAnonKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN6amN2d3NhbHhmdHN4b21maXlmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTk0NzYwMDMsImV4cCI6MjA3NTA1MjAwM30.KowEk4M6Ykl8q21DxsT9dKOgmwy0Hlg3cabD6tr3Q8k";
    const supabase = supabase.createClient(supabaseUrl, supabaseAnonKey);
    
    // 设置注册时间为当前时间
    document.addEventListener('DOMContentLoaded', () => {
      const now = new Date();
      const hours = now.getHours().toString().padStart(2, '0');
      const minutes = now.getMinutes().toString().padStart(2, '0');
      document.getElementById('registerTime').textContent = `今天 ${hours}:${minutes}`;
      
      // 检查用户是否已登录（防止直接访问此页面）
      checkUserStatus();
    });
    
    // 检查用户状态
    async function checkUserStatus() {
      try {
        const { data: { session } } = await supabase.auth.getSession();
        
        // 如果没有会话，说明用户未登录，重定向到登录页
        if (!session) {
          // 登录页面链接 - 跳转链接标识：LOGIN_PAGE_LINK
          window.location.href = 'index.html';
          return;
        }
        
        // 获取用户信息
        const { data: user } = await supabase
          .from('profiles')
          .select('status')
          .eq('id', session.user.id)
          .single();
          
        // 如果用户已通过审核，重定向到用户中心
        if (user && user.status === 'active') {
          // 用户中心链接 - 跳转链接标识：USER_DASHBOARD_LINK
          window.location.href = 'user-dashboard.html';
        }
        
      } catch (err) {
        console.error('检查用户状态错误:', err);
        // 发生错误时重定向到登录页
        // 登录页面链接 - 跳转链接标识：LOGIN_PAGE_LINK
        window.location.href = 'index.html';
      }
    }
  </script>
</body>
</html>
