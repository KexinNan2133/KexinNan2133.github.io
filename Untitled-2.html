<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>文字水印工具</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            overflow: auto; /* 添加滚动效果 */
        }
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start; /* 修改为顶部对齐 */
            font-family: Arial, sans-serif;
            background-color: skyblue;
        }
        .container {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0px 2px 10px rgba(0,0,0,0.1);
            margin-top: 20px; /* 添加顶部间距 */
        }
        .controls, .batch-controls { margin-bottom: 20px; }
        .controls > div, .batch-controls .input-group > div {
            margin-bottom: 10px;
        }
        canvas { border: 1px solid #ccc; max-width: 100%; }
        button {
            margin-right: 10px;
        }
        #batchPreview canvas {
            margin: 10px;
            border: 1px solid #ccc;
        }
        .image-properties {
            margin-top: 10px;
        }
        .image-properties div {
            margin-bottom: 5px;
        }
        @media (max-width: 600px) {
            .container {
                width: 90%;
                padding: 10px;
            }
            .controls, .batch-controls {
                width: 100%;
            }
            .controls > div, .batch-controls .input-group > div {
                width: 100%;
                margin-bottom: 10px;
            }
            canvas {
                width: 100%;
                height: auto;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>文字水印工具</h2>
        <div class="controls">
            <!-- Single image controls here -->
            <div>
                <label for="imageInput">上传图片：</label>
                <input type="file" id="imageInput" accept="image/*">
            </div>
            <div>
                <label for="watermarkText">水印文字：</label>
                <textarea id="watermarkText" rows="4" cols="50">水印</textarea>
            </div>
            <div>
                <label for="fontSize">字体大小：</label>
                <input type="number" id="fontSize" value="40" min="10" max="200"> px
            </div>
            <div>
                <label for="fontColor">字体颜色：</label>
                <input type="color" id="fontColor" value="#FF0000">
            </div>
            <div>
                <label for="angle">倾斜度：</label>
                <input type="range" id="angle" min="-90" max="90" value="-45">
                <span id="angleValue">-45</span>°
                <input type="number" id="angleNumber" value="-45" min="-90" max="90">
            </div>
            <div>
                <label for="positionX">X 位置：</label>
                <input type="range" id="positionX" min="0" max="100" value="50">
                <span id="positionXValue">50</span>%
            </div>
            <div>
                <label for="positionY">Y 位置：</label>
                <input type="range" id="positionY" min="0" max="100" value="50">
                <span id="positionYValue">50</span>%
            </div>
            <div>
                <label for="textAlign">文字对齐：</label>
                <select id="textAlign">
                    <option value="center">居中</option>
                    <option value="left">左对齐</option>
                    <option value="right">右对齐</option>
                </select>
            </div>
            <div class="image-properties" id="imageProperties">
                <div>宽度: <span id="imageWidth"></span> px</div>
                <div>高度: <span id="imageHeight"></span> px</div>
                <div>大小: <span id="imageSize"></span> KB</div>
            </div>
            <div style="display: flex; flex-direction: column;">
                <label for="scale">缩放比例：</label>
                <input type="number" id="scale" value="100" min="10" max="200"> %
            
                <label for="widthInput">宽度：</label>
                <input type="number" id="widthInput" min="10">
           
                <label for="heightInput">高度：</label>
                <input type="number" id="heightInput" min="10">
           
                <label for="standardSize">标准尺寸：</label>
                <select id="standardSize">
                    <option value="">选择尺寸</option>
                    <option value="295,413">一寸 (295x413)</option>
                    <option value="413,626">二寸 (413x626)</option>
                </select>
            </div>
            <div>
                <label for="compression">压缩大小：</label>
                <input type="number" id="compression" value="100" min="10" max="100"> KB
            </div>
        </div>
        <canvas id="canvas"></canvas>
        <div style="margin-top: 20px;">
            <button id="exportBtn">导出图片</button>
        </div>

        <hr style="margin:20px 0;">

        <div class="batch-controls">
            <h3>批量处理</h3>
            <div class="input-group">
                <div>
                    <label for="batchImageInput">上传多张图片：</label>
                    <input type="file" id="batchImageInput" accept="image/*" multiple>
                </div>
                <div>
                    <button id="batchExportBtn">批量导出图片</button>
                </div>
            </div>
            <!-- Preview container for batch processed images -->
            <div id="batchPreview"></div>
        </div>
    </div>

    <script>
        const imageInput = document.getElementById('imageInput');
        const watermarkText = document.getElementById('watermarkText');
        const fontSizeInput = document.getElementById('fontSize');
        const fontColorInput = document.getElementById('fontColor');
        const angleInput = document.getElementById('angle');
        const angleValue = document.getElementById('angleValue');
        const angleNumber = document.getElementById('angleNumber');
        const positionXInput = document.getElementById('positionX');
        const positionXValue = document.getElementById('positionXValue');
        const positionYInput = document.getElementById('positionY');
        const positionYValue = document.getElementById('positionYValue');
        const textAlignInput = document.getElementById('textAlign');
        const exportBtn = document.getElementById('exportBtn');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const scaleInput = document.getElementById('scale');
        const compressionInput = document.getElementById('compression');
        const imageWidth = document.getElementById('imageWidth');
        const imageHeight = document.getElementById('imageHeight');
        const imageSize = document.getElementById('imageSize');
        const widthInput = document.getElementById('widthInput');
        const heightInput = document.getElementById('heightInput');
        const standardSize = document.getElementById('standardSize');
        let img = new Image();

        let batchImageData = [];

        angleInput.addEventListener('input', () => {
            angleValue.textContent = angleInput.value;
            angleNumber.value = angleInput.value;
            if (img.src) redraw();
            updateBatchPreviews();
        });

        angleNumber.addEventListener('input', () => {
            angleInput.value = angleNumber.value;
            angleValue.textContent = angleNumber.value;
            if (img.src) redraw();
            updateBatchPreviews();
        });

        watermarkText.addEventListener('input', () => {
            redraw();
            updateBatchPreviews();
        });

        fontSizeInput.addEventListener('input', () => {
            redraw();
            updateBatchPreviews();
        });

        fontColorInput.addEventListener('input', () => {
            redraw();
            updateBatchPreviews();
        });

        positionXInput.addEventListener('input', () => {
            positionXValue.textContent = positionXInput.value;
            if (img.src) redraw();
            updateBatchPreviews();
        });

        positionYInput.addEventListener('input', () => {
            positionYValue.textContent = positionYInput.value;
            if (img.src) redraw();
            updateBatchPreviews();
        });

        textAlignInput.addEventListener('change', () => {
            redraw();
            updateBatchPreviews();
        });

        imageInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(event) {
                img = new Image();
                img.onload = function() {
                    canvas.width = img.width;
                    canvas.height = img.height;
                    imageWidth.textContent = img.width;
                    imageHeight.textContent = img.height;
                    imageSize.textContent = (file.size / 1024).toFixed(2);
                    redraw();
                }
                img.src = event.target.result;
            }
            reader.readAsDataURL(file);
        });

        scaleInput.addEventListener('input', () => {
            if (img.src) redraw();
            updateBatchPreviews();
        });

        widthInput.addEventListener('input', () => {
            if (img.src) redraw();
            updateBatchPreviews();
        });

        heightInput.addEventListener('input', () => {
            if (img.src) redraw();
            updateBatchPreviews();
        });

        standardSize.addEventListener('change', () => {
            const [width, height] = standardSize.value.split(',');
            if (width && height) {
                widthInput.value = width;
                heightInput.value = height;
                if (img.src) redraw();
                updateBatchPreviews();
            }
        });

        imageInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(event) {
                img = new Image();
                img.onload = function() {
                    canvas.width = img.width;
                    canvas.height = img.height;
                    redraw();
                }
                img.src = event.target.result;
            }
            reader.readAsDataURL(file);
        });

        function redraw() {
            if (!img.src) return;
            const scale = scaleInput.value / 100;
            const width = widthInput.value ? widthInput.value : img.width * scale;
            const height = heightInput.value ? heightInput.value : img.height * scale;
            canvas.width = width;
            canvas.height = height;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

            if (!img.src) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            
            const watermark = watermarkText.value;
            const fontSize = parseInt(fontSizeInput.value, 10);
            ctx.font = `${fontSize}px sans-serif`;
            ctx.fillStyle = fontColorInput.value;
            ctx.textBaseline = "middle";
            ctx.textAlign = textAlignInput.value;

            const x = (canvas.width * positionXInput.value) / 100;
            const y = (canvas.height * positionYInput.value) / 100;
            
            ctx.save();
            ctx.translate(x, y);
            const angle = angleInput.value * Math.PI / 180;
            ctx.rotate(angle);

            const lines = watermark.split('\n');
            const lineHeight = fontSize * 1.2;

            for (let i = 0; i < lines.length; i++) {
                ctx.fillText(lines[i], 0, (i - lines.length / 2) * lineHeight);
            }

            ctx.restore();
        }

        exportBtn.addEventListener('click', () => {
            const link = document.createElement('a');
            const compression = compressionInput.value;
            link.download = 'watermarked.png';
            link.href = canvas.toDataURL('image/png', compression / 100);
            link.click();
        });

        exportBtn.addEventListener('click', () => {
            const link = document.createElement('a');
            link.download = 'watermarked.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        });

        const batchImageInput = document.getElementById('batchImageInput');
        const batchExportBtn = document.getElementById('batchExportBtn');
        const batchPreview = document.getElementById('batchPreview');

        batchImageInput.addEventListener('change', (e) => {
            const files = Array.from(e.target.files);
            if (files.length === 0) return;
            batchImageData = [];
            let filesProcessed = 0;
            
            files.forEach((file) => {
                const reader = new FileReader();
                reader.onload = function(event) {
                    batchImageData.push({ file: file, dataURL: event.target.result });
                    filesProcessed++;
                    if (filesProcessed === files.length) {
                        updateBatchPreviews();
                    }
                }
                reader.readAsDataURL(file);
            });
        });

        function updateBatchPreviews() {
            batchPreview.innerHTML = "";
            batchImageData.forEach((item) => {
                const tempImg = new Image();
                tempImg.onload = function() {
                    const tempCanvas = document.createElement('canvas');
                    tempCanvas.width = tempImg.width;
                    tempCanvas.height = tempImg.height;
                    const tempCtx = tempCanvas.getContext('2d');
                    tempCtx.clearRect(0, 0, tempCanvas.width, tempCanvas.height);
                    tempCtx.drawImage(tempImg, 0, 0, tempCanvas.width, tempCanvas.height);
    
                    const watermark = watermarkText.value;
                    const fontSize = parseInt(fontSizeInput.value, 10);
                    tempCtx.font = `${fontSize}px sans-serif`;
                    tempCtx.fillStyle = fontColorInput.value;
                    tempCtx.textBaseline = "middle";
                    tempCtx.textAlign = textAlignInput.value;
    
                    const x = (tempCanvas.width * positionXInput.value) / 100;
                    const y = (tempCanvas.height * positionYInput.value) / 100;
                    
                    tempCtx.save();
                    tempCtx.translate(x, y);
                    const angle = angleInput.value * Math.PI / 180;
                    tempCtx.rotate(angle);

                    const lines = watermark.split('\n');
                    const lineHeight = fontSize * 1.2;

                    for (let i = 0; i < lines.length; i++) {
                        tempCtx.fillText(lines[i], 0, (i - lines.length / 2) * lineHeight);
                    }

                    tempCtx.restore();
    
                    batchPreview.appendChild(tempCanvas);
                }
                tempImg.src = item.dataURL;
            });
        }

        batchExportBtn.addEventListener('click', () => {
            if (batchImageData.length === 0) {
                alert("请先上传多张图片。");
                return;
            }
            batchImageData.forEach((item) => {
                const tempImg = new Image();
                tempImg.onload = function() {
                    const tempCanvas = document.createElement('canvas');
                    tempCanvas.width = tempImg.width;
                    tempCanvas.height = tempImg.height;
                    const tempCtx = tempCanvas.getContext('2d');
                    tempCtx.clearRect(0, 0, tempCanvas.width, tempCanvas.height);
                    tempCtx.drawImage(tempImg, 0, 0, tempCanvas.width, tempCanvas.height);
    
                    const watermark = watermarkText.value;
                    const fontSize = parseInt(fontSizeInput.value, 10);
                    tempCtx.font = `${fontSize}px sans-serif`;
                    tempCtx.fillStyle = fontColorInput.value;
                    tempCtx.textBaseline = "middle";
                    tempCtx.textAlign = textAlignInput.value;
    
                    const x = (tempCanvas.width * positionXInput.value) / 100;
                    const y = (tempCanvas.height * positionYInput.value) / 100;
                    
                    tempCtx.save();
                    tempCtx.translate(x, y);
                    const angle = angleInput.value * Math.PI / 180;
                    tempCtx.rotate(angle);

                    const lines = watermark.split('\n');
                    const lineHeight = fontSize * 1.2;

                    for (let i = 0; i < lines.length; i++) {
                        tempCtx.fillText(lines[i], 0, (i - lines.length / 2) * lineHeight);
                    }

                    tempCtx.restore();
    
                    const link = document.createElement('a');
                    const baseName = item.file.name.replace(/\.(png|jpe?g|gif)$/i, '');
                    link.download = baseName + '-watermarked.png';
                    link.href = tempCanvas.toDataURL('image/png');
                    link.click();
                }
                tempImg.src = item.dataURL;
            });
        });
    </script>
</body>
</html>
