<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guestbook</title>
    <link rel="stylesheet" href="./style1.css">
</head>
<body>
    <h1>Guestbook</h1>
    <form id="guestbook-form">
        <label for="name"> N a m e :</label>
        <input type="text" id="name" required>
        <br><br>
        <label for="message">Message:</label>
        <textarea id="message" required placeholder="请留言！" onfocus="this.placeholder=''"></textarea>
        <br><br>
        <button type="submit">提交</button>
    </form>
    <h2>Messages</h2>
    <div id="guestbook-entries"></div>
    <button id="clear-entries">清除留言</button>
    <div id="password-prompt" style="display: none;">
        <label for="password">请输入密码:</label>
        <input type="password" id="password">
        <button id="submit-password">提交</button>
    </div>
    
    <script src="./script.js"></script>
</body>
</html>
