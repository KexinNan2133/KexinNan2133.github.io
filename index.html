<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>线上交流平台 - 登录</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }
    
    body {
      background-color: #f5f7fa;
      color: #1d2129;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 1rem;
    }
    
    .hidden {
      display: none !important;
    }
    
    button {
      cursor: pointer;
      transition: all 0.2s ease;
    }
    
    input, select {
      font-family: inherit;
      transition: all 0.2s ease;
    }
    
    input:focus, select:focus {
      outline: none;
      border-color: #165dff;
      box-shadow: 0 0 0 2px rgba(22, 93, 255, 0.1);
    }
    
    .auth-container {
      display: flex;
      justify-content: center;
      align-items: center;
      flex: 1;
      padding: 2rem 0;
    }
    
    .auth-card {
      width: 100%;
      max-width: 400px;
      background-color: white;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      padding: 2.5rem;
    }
    
    .auth-header {
      margin-bottom: 2rem;
      text-align: center;
    }
    
    .auth-logo {
      width: 64px;
      height: 64px;
      margin: 0 auto 1rem;
      color: #165dff;
    }
    
    .auth-title {
      font-size: 1.75rem;
      font-weight: 700;
      color: #1d2129;
      margin-bottom: 0.5rem;
    }
    
    .auth-subtitle {
      color: #6b7280;
      font-size: 0.9375rem;
    }
    
    .tabs {
      display: flex;
      margin-bottom: 1.5rem;
      border-bottom: 1px solid #e5e7eb;
    }
    
    .tab {
      padding: 0.75rem 0;
      margin-right: 1.5rem;
      font-weight: 500;
      color: #6b7280;
      border-bottom: 2px solid transparent;
      cursor: pointer;
    }
    
    .tab.active {
      color: #165dff;
      border-bottom-color: #165dff;
    }
    
    .form-group {
      margin-bottom: 1.25rem;
    }
    
    .form-label {
      display: block;
      margin-bottom: 0.5rem;
      font-size: 0.875rem;
      font-weight: 500;
      color: #374151;
    }
    
    .form-control {
      width: 100%;
      padding: 0.875rem 1rem;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 0.9375rem;
      color: #1d2129;
    }
    
    .form-control::placeholder {
      color: #9ca3af;
    }
    
    .form-row {
      display: flex;
      gap: 0.75rem;
    }
    
    .form-row .form-group {
      flex: 1;
      margin-bottom: 1.25rem;
    }
    
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 0.875rem 1.5rem;
      border-radius: 8px;
      font-weight: 500;
      font-size: 0.9375rem;
      border: none;
      text-decoration: none;
    }
    
    .btn-primary {
      background-color: #165dff;
      color: white;
    }
    
    .btn-primary:hover {
      background-color: #0e4cca;
    }
    
    .btn-primary:disabled {
      background-color: #94bfff;
      cursor: not-allowed;
    }
    
    .btn-outline {
      background-color: transparent;
      color: #165dff;
      border: 1px solid #165dff;
    }
    
    .btn-outline:hover {
      background-color: #f0f7ff;
    }
    
    .text-center {
      text-align: center;
    }
    
    .mt-4 {
      margin-top: 1rem;
    }
    
    .mt-6 {
      margin-top: 1.5rem;
    }
    
    .text-sm {
      font-size: 0.875rem;
    }
    
    .text-gray-500 {
      color: #6b7280;
    }
    
    .text-blue-500 {
      color: #165dff;
    }
    
    .text-blue-500:hover {
      color: #0e4cca;
      text-decoration: underline;
    }
    
    .text-red-500 {
      color: #f53f3f;
    }
    
    .error-message {
      margin-top: 0.375rem;
      font-size: 0.875rem;
      color: #f53f3f;
      display: flex;
      align-items: center;
    }
    
    .error-message i {
      margin-right: 0.25rem;
      font-size: 0.75rem;
    }
    
    .form-options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    }
    
    .remember-me {
      display: flex;
      align-items: center;
    }
    
    .remember-me input {
      margin-right: 0.5rem;
    }
    
    .forgot-password {
      font-size: 0.875rem;
      color: #165dff;
      text-decoration: none;
    }
    
    .forgot-password:hover {
      text-decoration: underline;
    }
    
    .separator {
      display: flex;
      align-items: center;
      margin: 1.5rem 0;
    }
    
    .separator::before, .separator::after {
      content: '';
      flex: 1;
      height: 1px;
      background-color: #e5e7eb;
    }
    
    .separator span {
      padding: 0 0.75rem;
      font-size: 0.875rem;
      color: #6b7280;
    }
    
    .admin-link {
      display: inline-block;
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.875rem;
      color: #6b7280;
    }
    
    .admin-link i {
      margin-right: 0.25rem;
    }
    
    .admin-link:hover {
      color: #165dff;
      text-decoration: none;
    }
    
    .loading-spinner {
      width: 1rem;
      height: 1rem;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 1s ease-in-out infinite;
      margin-right: 0.5rem;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    @media (max-width: 640px) {
      .auth-card {
        padding: 1.5rem;
        margin: 1rem;
      }
      
      .auth-title {
        font-size: 1.5rem;
      }
    }
  </style>
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <svg class="auth-logo" fill="currentColor" viewBox="0 0 24 24">
          <path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z"></path>
        </svg>
        <h1 class="auth-title">线上交流平台</h1>
        <p class="auth-subtitle">请登录账号以继续使用</p>
      </div>
      
      <div class="tabs">
        <div class="tab active" data-tab="password-login">密码登录</div>
        <div class="tab" data-tab="code-login">验证码登录</div>
      </div>
      
      <!-- 密码登录表单 -->
      <form id="passwordLoginForm">
        <div class="form-group">
          <label for="loginUsername" class="form-label">用户名/手机号</label>
          <input 
            type="text" 
            id="loginUsername" 
            class="form-control" 
            placeholder="请输入用户名或手机号"
            required
          >
          <div id="usernameError" class="error-message hidden"></div>
        </div>
        
        <div class="form-group">
          <label for="loginPassword" class="form-label">密码</label>
          <input 
            type="password" 
            id="loginPassword" 
            class="form-control" 
            placeholder="请输入密码"
            required
          >
          <div id="passwordError" class="error-message hidden"></div>
        </div>
        
        <div class="form-options">
          <label class="remember-me">
            <input type="checkbox"> 记住我
          </label>
          <a href="#" class="forgot-password">忘记密码？</a>
        </div>
        
        <button 
          type="submit" 
          id="loginBtn" 
          class="btn btn-primary"
        >
          登录
        </button>
        
        <div class="text-center text-sm mt-4">
          还没有账号？
          <!-- 注册页面链接 - 跳转链接标识：REGISTER_PAGE_LINK -->
          <a href="register.html" id="goToRegister" class="text-blue-500 hover:underline">立即注册</a>
        </div>
      </form>
      
      <!-- 验证码登录表单 (默认隐藏) -->
      <form id="codeLoginForm" class="hidden">
        <div class="form-group">
          <label for="loginPhone" class="form-label">手机号</label>
          <input 
            type="tel" 
            id="loginPhone" 
            class="form-control" 
            placeholder="请输入手机号"
            required
          >
          <div id="phoneError" class="error-message hidden"></div>
        </div>
        
        <div class="form-row">
          <div class="form-group">
            <label for="loginCode" class="form-label">验证码</label>
            <input 
              type="text" 
              id="loginCode" 
              class="form-control" 
              placeholder="请输入验证码"
              required
            >
            <div id="codeError" class="error-message hidden"></div>
          </div>
          
          <div class="form-group" style="margin-bottom: 0;">
            <label class="form-label" style="visibility: hidden;">获取验证码</label>
            <button 
              type="button" 
              id="getCodeBtn" 
              class="btn btn-outline"
            >
              获取验证码
            </button>
          </div>
        </div>
        
        <button 
          type="submit" 
          id="codeLoginBtn" 
          class="btn btn-primary mt-4"
        >
          登录
        </button>
        
        <div class="text-center text-sm mt-4">
          还没有账号？
          <!-- 注册页面链接 - 跳转链接标识：REGISTER_PAGE_LINK -->
          <a href="register.html" class="text-blue-500 hover:underline">立即注册</a>
        </div>
      </form>
      
      <!-- 管理员登录入口 - 跳转链接标识：ADMIN_LOGIN_LINK -->
      <a href="admin-login.html" class="admin-link">
        <i class="fas fa-shield-alt"></i> 管理员登录入口
      </a>
    </div>
  </div>

  <script>
    // Supabase 配置 - 使用提供的项目信息
    // 正确的 Supabase 初始化代码（需放在所有使用 supabase 的代码之前）
    const supabaseUrl = "https://czjcvwsalxftsxomfiyf.supabase.co";
    const supabaseAnonKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN6amN2d3NhbHhmdHN4b21maXlmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTk0NzYwMDMsImV4cCI6MjA3NTA1MjAwM30.KowEk4M6Ykl8q21DxsT9dKOgmwy0Hlg3cabD6tr3Q8k";
    const supabase = supabase.createClient(supabaseUrl, supabaseAnonKey);
    
    // DOM 元素
    const tabs = document.querySelectorAll('.tab');
    const passwordLoginForm = document.getElementById('passwordLoginForm');
    const codeLoginForm = document.getElementById('codeLoginForm');
    const loginBtn = document.getElementById('loginBtn');
    const codeLoginBtn = document.getElementById('codeLoginBtn');
    const getCodeBtn = document.getElementById('getCodeBtn');
    const loginUsername = document.getElementById('loginUsername');
    const loginPassword = document.getElementById('loginPassword');
    const loginPhone = document.getElementById('loginPhone');
    const loginCode = document.getElementById('loginCode');
    
    // 错误提示元素
    const usernameError = document.getElementById('usernameError');
    const passwordError = document.getElementById('passwordError');
    const phoneError = document.getElementById('phoneError');
    const codeError = document.getElementById('codeError');
    
    // 切换登录方式
    tabs.forEach(tab => {
      tab.addEventListener('click', () => {
        // 更新标签样式
        tabs.forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        
        // 显示对应的表单
        const tabId = tab.getAttribute('data-tab');
        if (tabId === 'password-login') {
          passwordLoginForm.classList.remove('hidden');
          codeLoginForm.classList.add('hidden');
        } else {
          passwordLoginForm.classList.add('hidden');
          codeLoginForm.classList.remove('hidden');
        }
      });
    });
    
    // 显示错误提示
    function showError(element, message) {
      element.innerHTML = `<i class="fas fa-exclamation-circle"></i> ${message}`;
      element.classList.remove('hidden');
    }
    
    // 隐藏错误提示
    function hideError(element) {
      element.classList.add('hidden');
    }
    
    // 密码登录表单提交
    passwordLoginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const username = loginUsername.value.trim();
      const password = loginPassword.value;
      
      // 简单验证
      let isValid = true;
      
      if (!username) {
        showError(usernameError, '请输入用户名或手机号');
        isValid = false;
      } else {
        hideError(usernameError);
      }
      
      if (!password) {
        showError(passwordError, '请输入密码');
        isValid = false;
      } else {
        hideError(passwordError);
      }
      
      if (!isValid) {
        return;
      }
      
      // 禁用按钮并显示加载状态
      loginBtn.disabled = true;
      loginBtn.innerHTML = '<div class="loading-spinner"></div> 登录中...';
      
      try {
        // 检查是用户名还是手机号登录
        const isPhone = /^1[3-9]\d{9}$/.test(username);
        let query;
        
        if (isPhone) {
          // 手机号登录
          query = supabase.from('profiles').select('id, password_hash, status').eq('phone', username).single();
        } else {
          // 用户名登录
          query = supabase.from('profiles').select('id, password_hash, status').eq('username', username).single();
        }
        
        const { data: user, error } = await query;
        
        if (error) {
          showError(usernameError, '用户名或密码错误');
          loginBtn.disabled = false;
          loginBtn.textContent = '登录';
          return;
        }
        
        // 检查用户状态
        if (user.status === 'pending') {
          showError(usernameError, '您的账号正在审核中，请耐心等待');
          loginBtn.disabled = false;
          loginBtn.textContent = '登录';
          return;
        }
        
        if (user.status === 'disabled') {
          showError(usernameError, '您的账号已被禁用，请联系管理员');
          loginBtn.disabled = false;
          loginBtn.textContent = '登录';
          return;
        }
        
        // 验证密码（实际项目中应在后端验证）
        // 这里仅为示例，生产环境需使用bcrypt等算法验证
        if (user.password_hash !== password) {
          showError(passwordError, '用户名或密码错误');
          loginBtn.disabled = false;
          loginBtn.textContent = '登录';
          return;
        }
        
        // 更新最后登录时间
        await supabase
          .from('profiles')
          .update({ last_login_at: new Date() })
          .eq('id', user.id);
        
        // 登录成功，跳转到用户中心
        // 用户中心链接 - 跳转链接标识：USER_DASHBOARD_LINK
        window.location.href = 'user-dashboard.html';
        
      } catch (err) {
        console.error('登录错误:', err);
        showError(usernameError, '登录失败，请重试');
        loginBtn.disabled = false;
        loginBtn.textContent = '登录';
      }
    });
    
    // 发送验证码
    getCodeBtn.addEventListener('click', async () => {
      const phone = loginPhone.value.trim();
      
      // 验证手机号
      if (!/^1[3-9]\d{9}$/.test(phone)) {
        showError(phoneError, '请输入有效的手机号');
        return;
      }
      
      // 禁用按钮并显示倒计时
      getCodeBtn.disabled = true;
      getCodeBtn.textContent = '发送中...';
      
      try {
        // 检查手机号是否已注册
        const { data: user } = await supabase
          .from('profiles')
          .select('id')
          .eq('phone', phone)
          .single();
          
        if (!user) {
          showError(phoneError, '该手机号未注册，请先注册');
          getCodeBtn.disabled = false;
          getCodeBtn.textContent = '获取验证码';
          return;
        }
        
        // 生成6位验证码
        const code = Math.floor(100000 + Math.random() * 900000).toString();
        
        // 存储验证码到数据库（有效期5分钟）
        const { error } = await supabase
          .from('verify_codes')
          .insert([{
            target: phone,
            code,
            type: 'user_login',
            expire_at: new Date(Date.now() + 5 * 60 * 1000) // 5分钟有效期
          }]);
          
        if (error) throw error;
        
        // 显示倒计时
        let countdown = 60;
        getCodeBtn.textContent = `重新发送(${countdown}s)`;
        
        const timer = setInterval(() => {
          countdown--;
          getCodeBtn.textContent = `重新发送(${countdown}s)`;
          
          if (countdown <= 0) {
            clearInterval(timer);
            getCodeBtn.disabled = false;
            getCodeBtn.textContent = '获取验证码';
          }
        }, 1000);
        
        // 提示用户（实际项目中应调用短信API发送验证码）
        alert(`验证码已发送，您的验证码是：${code}（5分钟内有效）`);
        
      } catch (err) {
        console.error('发送验证码错误:', err);
        showError(phoneError, '发送验证码失败，请重试');
        getCodeBtn.disabled = false;
        getCodeBtn.textContent = '获取验证码';
      }
    });
    
    // 验证码登录表单提交
    codeLoginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const phone = loginPhone.value.trim();
      const code = loginCode.value.trim();
      
      // 简单验证
      let isValid = true;
      
      if (!/^1[3-9]\d{9}$/.test(phone)) {
        showError(phoneError, '请输入有效的手机号');
        isValid = false;
      } else {
        hideError(phoneError);
      }
      
      if (!code || code.length !== 6) {
        showError(codeError, '请输入6位验证码');
        isValid = false;
      } else {
        hideError(codeError);
      }
      
      if (!isValid) {
        return;
      }
      
      // 禁用按钮并显示加载状态
      codeLoginBtn.disabled = true;
      codeLoginBtn.innerHTML = '<div class="loading-spinner"></div> 登录中...';
      
      try {
        // 验证验证码
        const { data: verifyCode, error: codeError } = await supabase
          .from('verify_codes')
          .select('code, expire_at')
          .eq('target', phone)
          .eq('type', 'user_login')
          .single();
          
        if (codeError || !verifyCode) {
          showError(codeErrorEl, '验证码错误或已过期，请重新获取');
          codeLoginBtn.disabled = false;
          codeLoginBtn.textContent = '登录';
          return;
        }
        
        // 检查验证码是否过期
        if (new Date(verifyCode.expire_at) < new Date()) {
          showError(codeErrorEl, '验证码已过期，请重新获取');
          codeLoginBtn.disabled = false;
          codeLoginBtn.textContent = '登录';
          return;
        }
        
        // 检查验证码是否匹配
        if (verifyCode.code !== code) {
          showError(codeErrorEl, '验证码错误，请重新输入');
          codeLoginBtn.disabled = false;
          codeLoginBtn.textContent = '登录';
          return;
        }
        
        // 获取用户信息
        const { data: user } = await supabase
          .from('profiles')
          .select('id, status')
          .eq('phone', phone)
          .single();
          
        // 检查用户状态
        if (user.status === 'pending') {
          showError(phoneError, '您的账号正在审核中，请耐心等待');
          codeLoginBtn.disabled = false;
          codeLoginBtn.textContent = '登录';
          return;
        }
        
        if (user.status === 'disabled') {
          showError(phoneError, '您的账号已被禁用，请联系管理员');
          codeLoginBtn.disabled = false;
          codeLoginBtn.textContent = '登录';
          return;
        }
        
        // 更新最后登录时间
        await supabase
          .from('profiles')
          .update({ last_login_at: new Date() })
          .eq('id', user.id);
          
        // 删除已使用的验证码
        await supabase
          .from('verify_codes')
          .delete()
          .eq('target', phone)
          .eq('code', code);
        
        // 登录成功，跳转到用户中心
        // 用户中心链接 - 跳转链接标识：USER_DASHBOARD_LINK
        window.location.href = 'user-dashboard.html';
        
      } catch (err) {
        console.error('验证码登录错误:', err);
        showError(phoneError, '登录失败，请重试');
        codeLoginBtn.disabled = false;
        codeLoginBtn.textContent = '登录';
      }
    });
  </script>
</body>
</html>
