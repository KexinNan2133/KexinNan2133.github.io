<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理员登录 - 线上交流平台</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }
    
    body {
      background-color: #f5f7fa;
      color: #1d2129;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 1rem;
    }
    
    .hidden {
      display: none !important;
    }
    
    button {
      cursor: pointer;
      transition: all 0.2s ease;
    }
    
    input, select {
      font-family: inherit;
      transition: all 0.2s ease;
    }
    
    input:focus, select:focus {
      outline: none;
      border-color: #165dff;
      box-shadow: 0 0 0 2px rgba(22, 93, 255, 0.1);
    }
    
    .back-link {
      display: inline-flex;
      align-items: center;
      color: #6b7280;
      text-decoration: none;
      margin: 1.5rem 0;
    }
    
    .back-link:hover {
      color: #165dff;
    }
    
    .back-link i {
      margin-right: 0.5rem;
    }
    
    .auth-container {
      display: flex;
      justify-content: center;
      align-items: center;
      flex: 1;
      padding: 2rem 0;
    }
    
    .auth-card {
      width: 100%;
      max-width: 400px;
      background-color: white;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      padding: 2.5rem;
    }
    
    .auth-header {
      margin-bottom: 2rem;
      text-align: center;
    }
    
    .auth-badge {
      display: inline-block;
      background-color: #f0f7ff;
      color: #165dff;
      padding: 0.25rem 0.75rem;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 500;
      margin-bottom: 1rem;
    }
    
    .auth-title {
      font-size: 1.75rem;
      font-weight: 700;
      color: #1d2129;
      margin-bottom: 0.5rem;
    }
    
    .auth-subtitle {
      color: #6b7280;
      font-size: 0.9375rem;
    }
    
    .form-group {
      margin-bottom: 1.25rem;
    }
    
    .form-label {
      display: block;
      margin-bottom: 0.5rem;
      font-size: 0.875rem;
      font-weight: 500;
      color: #374151;
    }
    
    .form-control {
      width: 100%;
      padding: 0.875rem 1rem;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 0.9375rem;
      color: #1d2129;
    }
    
    .form-control::placeholder {
      color: #9ca3af;
    }
    
    .form-row {
      display: flex;
      gap: 0.75rem;
    }
    
    .form-row .form-group {
      flex: 1;
      margin-bottom: 1.25rem;
    }
    
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 0.875rem 1.5rem;
      border-radius: 8px;
      font-weight: 500;
      font-size: 0.9375rem;
      border: none;
      text-decoration: none;
    }
    
    .btn-primary {
      background-color: #165dff;
      color: white;
    }
    
    .btn-primary:hover {
      background-color: #0e4cca;
    }
    
    .btn-primary:disabled {
      background-color: #94bfff;
      cursor: not-allowed;
    }
    
    .text-center {
      text-align: center;
    }
    
    .mt-4 {
      margin-top: 1rem;
    }
    
    .mt-6 {
      margin-top: 1.5rem;
    }
    
    .text-sm {
      font-size: 0.875rem;
    }
    
    .text-gray-500 {
      color: #6b7280;
    }
    
    .text-blue-500 {
      color: #165dff;
    }
    
    .text-blue-500:hover {
      color: #0e4cca;
      text-decoration: underline;
    }
    
    .text-red-500 {
      color: #f53f3f;
    }
    
    .error-message {
      margin-top: 0.375rem;
      font-size: 0.875rem;
      color: #f53f3f;
      display: flex;
      align-items: center;
    }
    
    .error-message i {
      margin-right: 0.25rem;
      font-size: 0.75rem;
    }
    
    .form-options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    }
    
    .remember-me {
      display: flex;
      align-items: center;
    }
    
    .remember-me input {
      margin-right: 0.5rem;
    }
    
    .forgot-password {
      font-size: 0.875rem;
      color: #165dff;
      text-decoration: none;
    }
    
    .forgot-password:hover {
      text-decoration: underline;
    }
    
    .security-info {
      background-color: #f0f7ff;
      border-left: 3px solid #165dff;
      padding: 0.75rem;
      margin-bottom: 1.5rem;
      border-radius: 0 4px 4px 0;
      font-size: 0.875rem;
      color: #1d39c4;
    }
    
    .security-info i {
      margin-right: 0.5rem;
    }
    
    .loading-spinner {
      width: 1rem;
      height: 1rem;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 1s ease-in-out infinite;
      margin-right: 0.5rem;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    @media (max-width: 640px) {
      .auth-card {
        padding: 1.5rem;
        margin: 1rem;
      }
      
      .auth-title {
        font-size: 1.5rem;
      }
      
      .form-row {
        flex-direction: column;
        gap: 0;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- 返回用户登录页 - 跳转链接标识：USER_LOGIN_LINK -->
    <a href="index.html" class="back-link">
      <i class="fas fa-arrow-left"></i> 返回用户登录
    </a>
  </div>
  
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-badge">
          <i class="fas fa-shield-alt mr-1"></i> 管理员专用
        </div>
        <h1 class="auth-title">管理员登录</h1>
        <p class="auth-subtitle">请输入管理员账号和密码以登录后台</p>
      </div>
      
      <div class="security-info">
        <i class="fas fa-info-circle"></i>
        <span>管理员登录将进行操作日志记录，请注意账号安全</span>
      </div>
      
      <form id="adminLoginForm">
        <div class="form-group">
          <label for="adminUsername" class="form-label">管理员账号</label>
          <input 
            type="text" 
            id="adminUsername" 
            class="form-control" 
            placeholder="请输入管理员账号"
            required
          >
          <div id="usernameError" class="error-message hidden"></div>
        </div>
        
        <div class="form-group">
          <label for="adminPassword" class="form-label">密码</label>
          <input 
            type="password" 
            id="adminPassword" 
            class="form-control" 
            placeholder="请输入密码"
            required
          >
          <div id="passwordError" class="error-message hidden"></div>
        </div>
        
        <div class="form-row">
          <div class="form-group">
            <label for="adminVerifyCode" class="form-label">验证码</label>
            <input 
              type="text" 
              id="adminVerifyCode" 
              class="form-control" 
              placeholder="请输入验证码"
              required
            >
            <div id="codeError" class="error-message hidden"></div>
          </div>
          
          <div class="form-group" style="margin-bottom: 0;">
            <label class="form-label" style="visibility: hidden;">获取验证码</label>
            <button 
              type="button" 
              id="getCodeBtn" 
              class="btn btn-outline"
            >
              获取验证码
            </button>
          </div>
        </div>
        
        <div class="form-options">
          <label class="remember-me">
            <input type="checkbox"> 记住我
          </label>
          <a href="#" class="forgot-password">忘记密码？</a>
        </div>
        
        <button 
          type="submit" 
          id="loginBtn" 
          class="btn btn-primary mt-4"
        >
          登录管理后台
        </button>
      </form>
    </div>
  </div>

  <script>
    // Supabase 配置 - 使用提供的项目信息
    const supabaseUrl = "https://czjcvwsalxftsxomfiyf.supabase.co";
    const supabaseAnonKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN6amN2d3NhbHhmdHN4b21maXlmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTk0NzYwMDMsImV4cCI6MjA3NTA1MjAwM30.KowEk4M6Ykl8q21DxsT9dKOgmwy0Hlg3cabD6tr3Q8k";
    const supabase = supabase.createClient(supabaseUrl, supabaseAnonKey);
    
    // DOM 元素
    const adminLoginForm = document.getElementById('adminLoginForm');
    const adminUsername = document.getElementById('adminUsername');
    const adminPassword = document.getElementById('adminPassword');
    const adminVerifyCode = document.getElementById('adminVerifyCode');
    const getCodeBtn = document.getElementById('getCodeBtn');
    const loginBtn = document.getElementById('loginBtn');
    
    // 错误提示元素
    const usernameError = document.getElementById('usernameError');
    const passwordError = document.getElementById('passwordError');
    const codeError = document.getElementById('codeError');
    
    // 登录错误计数（防暴力破解）
    let loginErrorCount = 0;
    
    // 显示错误提示
    function showError(element, message) {
      element.innerHTML = `<i class="fas fa-exclamation-circle"></i> ${message}`;
      element.classList.remove('hidden');
    }
    
    // 隐藏错误提示
    function hideError(element) {
      element.classList.add('hidden');
    }
    
    // 发送验证码
    getCodeBtn.addEventListener('click', async () => {
      // 简单验证管理员账号
      const username = adminUsername.value.trim();
      
      if (!username) {
        showError(usernameError, '请先输入管理员账号');
        return;
      }
      
      // 检查账号是否存在
      try {
        const { data: admin } = await supabase
          .from('admin_users')
          .select('id')
          .eq('username', username)
          .single();
          
        if (!admin) {
          showError(usernameError, '管理员账号不存在');
          return;
        }
        
        // 禁用按钮并显示倒计时
        getCodeBtn.disabled = true;
        getCodeBtn.textContent = '发送中...';
        
        // 生成6位验证码
        const code = Math.floor(100000 + Math.random() * 900000).toString();
        
        // 存储验证码到数据库（有效期5分钟）
        const { error } = await supabase
          .from('verify_codes')
          .insert([{
            target: username,
            code,
            type: 'admin_login',
            expire_at: new Date(Date.now() + 5 * 60 * 1000) // 5分钟有效期
          }]);
          
        if (error) throw error;
        
        // 显示倒计时
        let countdown = 60;
        getCodeBtn.textContent = `重新发送(${countdown}s)`;
        
        const timer = setInterval(() => {
          countdown--;
          getCodeBtn.textContent = `重新发送(${countdown}s)`;
          
          if (countdown <= 0) {
            clearInterval(timer);
            getCodeBtn.disabled = false;
            getCodeBtn.textContent = '获取验证码';
          }
        }, 1000);
        
        // 提示用户（实际项目中应调用短信/邮件API发送验证码）
        alert(`验证码已发送，您的验证码是：${code}（5分钟内有效）`);
        
      } catch (err) {
        console.error('发送验证码错误:', err);
        showError(codeError, '发送验证码失败，请重试');
        getCodeBtn.disabled = false;
        getCodeBtn.textContent = '获取验证码';
      }
    });
    
    // 表单提交
    adminLoginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const username = adminUsername.value.trim();
      const password = adminPassword.value;
      const code = adminVerifyCode.value.trim();
      
      // 简单验证
      let isValid = true;
      
      if (!username) {
        showError(usernameError, '请输入管理员账号');
        isValid = false;
      } else {
        hideError(usernameError);
      }
      
      if (!password) {
        showError(passwordError, '请输入密码');
        isValid = false;
      } else {
        hideError(passwordError);
      }
      
      if (!code || code.length !== 6) {
        showError(codeError, '请输入6位验证码');
        isValid = false;
      } else {
        hideError(codeError);
      }
      
      if (!isValid) {
        return;
      }
      
      // 检查是否已达到登录尝试上限
      if (loginErrorCount >= 5) {
        showError(usernameError, '登录尝试次数过多，请10分钟后再试');
        return;
      }
      
      // 禁用按钮并显示加载状态
      loginBtn.disabled = true;
      loginBtn.innerHTML = '<div class="loading-spinner"></div> 登录中...';
      
      try {
        // 验证验证码
        const { data: verifyCode, error: codeError } = await supabase
          .from('verify_codes')
          .select('code, expire_at')
          .eq('target', username)
          .eq('type', 'admin_login')
          .single();
          
        if (codeError || !verifyCode) {
          showError(codeErrorEl, '验证码错误或已过期，请重新获取');
          loginErrorCount++;
          loginBtn.disabled = false;
          loginBtn.textContent = '登录管理后台';
          return;
        }
        
        // 检查验证码是否过期
        if (new Date(verifyCode.expire_at) < new Date()) {
          showError(codeErrorEl, '验证码已过期，请重新获取');
          loginErrorCount++;
          loginBtn.disabled = false;
          loginBtn.textContent = '登录管理后台';
          return;
        }
        
        // 检查验证码是否匹配
        if (verifyCode.code !== code) {
          showError(codeErrorEl, '验证码错误，请重新输入');
          loginErrorCount++;
          loginBtn.disabled = false;
          loginBtn.textContent = '登录管理后台';
          return;
        }
        
        // 获取管理员信息
        const { data: admin, error } = await supabase
          .from('admin_users')
          .select('id, password_hash, role')
          .eq('username', username)
          .single();
          
        if (error) {
          showError(usernameError, '管理员账号不存在');
          loginErrorCount++;
          loginBtn.disabled = false;
          loginBtn.textContent = '登录管理后台';
          return;
        }
        
        // 验证密码（实际项目中应在后端验证）
        // 这里仅为示例，生产环境需使用bcrypt等算法验证
        if (admin.password_hash !== password) {
          showError(passwordError, '密码错误');
          loginErrorCount++;
          
          // 记录登录错误
          await logLoginError(username);
          
          loginBtn.disabled = false;
          loginBtn.textContent = '登录管理后台';
          return;
        }
        
        // 更新最后登录时间
        await supabase
          .from('admin_users')
          .update({ last_login_at: new Date() })
          .eq('id', admin.id);
          
        // 记录登录日志
        await supabase
          .from('admin_operation_logs')
          .insert([{
            admin_id: admin.id,
            operation_type: "login",
            operation_object: "system",
            operation_content: {
              login_time: new Date().toISOString(),
              ip: await getClientIP(),
              role: admin.role
            }
          }]);
          
        // 删除已使用的验证码
        await supabase
          .from('verify_codes')
          .delete()
          .eq('target', username)
          .eq('code', code);
        
        // 登录成功，跳转到管理员后台
        // 管理员后台链接 - 跳转链接标识：ADMIN_DASHBOARD_LINK
        window.location.href = 'admin-dashboard.html';
        
      } catch (err) {
        console.error('管理员登录错误:', err);
        showError(usernameError, '登录失败，请重试');
        loginErrorCount++;
        loginBtn.disabled = false;
        loginBtn.textContent = '登录管理后台';
      }
    });
    
    // 记录登录错误
    async function logLoginError(username) {
      try {
        // 检查是否已有该用户名的错误记录
        const { data: existingError } = await supabase
          .from('login_errors')
          .select('id, error_count, locked_until')
          .eq('username', username)
          .single();
          
        if (existingError) {
          // 检查是否已锁定
          if (existingError.locked_until && new Date(existingError.locked_until) > new Date()) {
            showError(usernameError, '账号已临时锁定，请10分钟后再试');
            return;
          }
          
          // 更新错误计数
          const newCount = existingError.error_count + 1;
          let lockedUntil = null;
          
          // 连续5次错误则锁定10分钟
          if (newCount >= 5) {
            lockedUntil = new Date(Date.now() + 10 * 60 * 1000);
            showError(usernameError, '登录尝试次数过多，账号已临时锁定10分钟');
          }
          
          await supabase
            .from('login_errors')
            .update({
              error_count: newCount,
              locked_until: lockedUntil,
              updated_at: new Date()
            })
            .eq('id', existingError.id);
            
        } else {
          // 创建新的错误记录
          await supabase
            .from('login_errors')
            .insert([{
              username,
              error_count: 1
            }]);
        }
        
      } catch (err) {
        console.error('记录登录错误失败:', err);
      }
    }
    
    // 获取客户端IP
    async function getClientIP() {
      try {
        const res = await fetch("https://api.ipify.org?format=json");
        const data = await res.json();
        return data.ip;
      } catch (err) {
        return "unknown";
      }
    }
  </script>
</body>
</html>
